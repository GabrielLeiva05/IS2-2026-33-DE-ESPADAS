<!DOCTYPE html>
<!-- Equivalente a LoginPage.jsx. El <form> lo recibe PortalController.ingresar() (POST /login). -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<div class="bg-primary min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-4">
                            <i class="bi bi-heart-pulse me-2"></i>Consultorio
                        </h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Usuario o clave incorrectos</div>

                        <!-- Sin JavaScript: el navegador manda los campos (por su "name") y recarga la página -->
                        <form th:action="@{/login}" method="post">
                            <div class="form-floating mb-3">
                                <input class="form-control" id="usuario" name="nombreUsuario" placeholder="usuario"
                                       th:value="${nombreUsuario}" autofocus>
                                <label for="usuario">Usuario</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input class="form-control" id="clave" name="clave" type="password" placeholder="clave">
                                <label for="clave">Clave</label>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
