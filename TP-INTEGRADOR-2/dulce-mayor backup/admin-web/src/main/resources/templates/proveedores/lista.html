<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Proveedores')}"></head>
<body class="app-admin">
<div th:replace="~{fragments/iconos :: sprite}"></div>
<div class="velo" data-velo></div>
<div class="shell">
    <aside th:replace="~{fragments/base :: sidebar}"></aside>
    <div class="shell-main">
        <header th:replace="~{fragments/base :: topbar('Proveedores')}"></header>
        <main class="contenido">
            <div class="encabezado-pagina mt-4">
                <div><h1>Proveedores</h1><p>Empresas que le facturan a Dulce Mayor.</p></div>
                <a class="btn btn-primario" th:href="@{/proveedores/nuevo}"><svg class="icono icono-sm"><use href="#i-mas"/></svg>Nuevo proveedor</a>
            </div>
            <div th:replace="~{fragments/base :: alertas}"></div>
            <div class="vacio tarjeta mt-4" th:if="${proveedores.isEmpty()}">
                <svg class="icono"><use href="#i-documento"/></svg><p class="mb-0">Todavía no hay proveedores.</p></div>
            <section class="tarjeta tarjeta-tabla mt-4" th:unless="${proveedores.isEmpty()}">
                <table class="tabla tabla-apilable">
                    <thead><tr><th>Razón social</th><th>CUIT</th><th>Dirección</th><th><span class="oculto-visual">Acciones</span></th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${proveedores}">
                        <td class="celda-principal"><strong th:text="${p.razonSocial}">Proveedor</strong></td>
                        <td data-label="CUIT" th:text="${p.cuit}">CUIT</td>
                        <td data-label="Dirección" th:text="${p.direccionLegible}">Dirección</td>
                        <td class="celda-acciones">
                            <a class="btn btn-secundario btn-chico" th:href="@{/proveedores/{id}/editar(id=${p.id})}"><svg class="icono icono-sm"><use href="#i-editar"/></svg>Editar</a>
                            <form th:action="@{/proveedores/{id}/baja(id=${p.id})}" method="post" th:data-confirmar="'¿Dar de baja a ' + ${p.razonSocial} + '?'">
                                <button type="submit" class="btn btn-peligro btn-chico" aria-label="Dar de baja"><svg class="icono icono-sm"><use href="#i-baja"/></svg></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/base :: navInferior}"></nav>
</body>
</html>
