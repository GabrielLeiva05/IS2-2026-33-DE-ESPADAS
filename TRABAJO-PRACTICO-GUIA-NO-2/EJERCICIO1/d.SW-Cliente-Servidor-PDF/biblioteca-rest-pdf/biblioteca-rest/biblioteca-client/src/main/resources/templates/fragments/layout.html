<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Biblioteca'">Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="barra(activo)" class="barra">
    <div class="container barra-interior">
        <a class="marca" th:href="@{/}">Biblioteca</a>
        <nav class="menu" aria-label="Secciones">
            <a th:href="@{/personas}" th:classappend="${activo == 'personas'} ? 'activo'">Personas</a>
            <a th:href="@{/libros}" th:classappend="${activo == 'libros'} ? 'activo'">Libros</a>
            <a th:href="@{/autores}" th:classappend="${activo == 'autores'} ? 'activo'">Autores</a>
            <a th:href="@{/localidades}" th:classappend="${activo == 'localidades'} ? 'activo'">Localidades</a>
        </nav>
    </div>
</header>

<div th:fragment="alertas">
    <div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

<footer th:fragment="pie" class="pie">
    <div class="container">Cliente web · consume la API REST del servidor mediante RestTemplate</div>
</footer>

</body>
</html>
