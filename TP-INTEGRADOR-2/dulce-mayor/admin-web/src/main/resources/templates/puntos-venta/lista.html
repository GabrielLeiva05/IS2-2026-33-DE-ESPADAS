<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Puntos de venta')}"></head>
<body class="app-admin">
<div th:replace="~{fragments/iconos :: sprite}"></div>
<div class="velo" data-velo></div>
<div class="shell">
    <aside th:replace="~{fragments/base :: sidebar}"></aside>
    <div class="shell-main">
        <header th:replace="~{fragments/base :: topbar('Puntos de venta')}"></header>
        <main class="contenido">
            <div class="encabezado-pagina mt-4">
                <div>
                    <h1>Puntos de venta</h1>
                    <p>Comercios dados de alta por los preventistas, con su ubicación y responsable.</p>
                </div>
                <span class="insignia insignia-violeta" th:text="${puntos.size()} + ' comercios'">0 comercios</span>
            </div>

            <div th:replace="~{fragments/base :: alertas}"></div>

            <section class="tarjeta tarjeta-tabla">
                <div class="vacio" th:if="${puntos.isEmpty()}">
                    <svg class="icono"><use href="#i-tienda"/></svg>
                    <p class="mb-0">Todavía no hay puntos de venta registrados.</p>
                </div>
                <table class="tabla tabla-apilable" th:unless="${puntos.isEmpty()}">
                    <thead><tr><th>Comercio</th><th>Responsable</th><th>Ubicación</th><th>Contacto</th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${puntos}">
                        <td class="celda-principal"><strong th:text="${p.nombreComercial}">Comercio</strong></td>
                        <td data-label="Responsable" th:text="${p.responsable}">Responsable</td>
                        <td data-label="Ubicación" th:text="${p.ubicacion}">Ubicación</td>
                        <td data-label="Contacto" th:text="${p.telefono} ?: ${p.emailContacto}">Contacto</td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/base :: navInferior}"></nav>
</body>
</html>
