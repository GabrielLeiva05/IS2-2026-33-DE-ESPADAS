<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
 <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="favicon.ico">

	<title th:text="${titleEdit}"></title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
  </head>

  <body>

    <header th:insert="~{fragments/menubody :: menu-principal}"></header>

    <main role="main">     
      <hr>
      <div class="container"> 

        <div class="card">
		  <h4 class="card-header">
			<strong th:text="${titleEdit}"></strong>
		  </h4>            
          <div class="card-body">
			
			<form th:action="@{'/' + ${nameEntityLower} + '/actualizar'}" method="post" th:object="${item}">
			
			  <p th:if="${msgExito != null}" th:text="${msgExito}" style="color:green;"></p>	
			  <p th:if="${msgError != null}" th:text="${msgError}" style="color: red;"></p>
  
              <div class="row">
                <div class="col-md-6"> 
                  <div class="form-group">
					
					<input type="hidden" name="id" th:value="${empresa.id}">
					
                    <label for="razonSocial">Razón Social</label>
                    <input type="text" name="razonSocial" th:value="${empresa.razonSocial}" th:disabled="${isDisabled}" class="form-control" placeholder="" required="required" >
                  
					<label for="cuit">Cuit</label>
					<input type="text" name="cuit" th:value="${empresa.cuit}" th:disabled="${isDisabled}" class="form-control" placeholder="" required="required" >
										
					<label for="telefono">Teléfono</label>
					<input type="text" name="telefono" th:value="${empresa.telefono}" th:disabled="${isDisabled}" class="form-control" placeholder="" required="required" >
					
					<label for="correoElectronico">Correo Electrónico</label>
					<input type="text" name="correoElectronico" th:value="${empresa.correoElectronico}" th:disabled="${isDisabled}" class="form-control" placeholder="" required="required" >
															
				  </div>
                </div>                
              </div> 
              
              <hr>
			  <div class="d-grid gap-2 float-right justify-content-md-end">
				<button type="submit" title="Guardar el registro." class="btn btn-primary" th:disabled="${isDisabled}">ACEPTAR</button>   
				<a class="btn btn-primary" th:href="@{'/' + ${nameEntityLower} + '/cancelar'}" role="button">CANCELAR</a>
			  </div>
			  
			</form>
			 
          </div>
        </div>
      </div> <!-- /container -->

    </main>

    <footer th:insert="~{fragments/footer :: pie-pagina}" class="footer"></footer>

    <!-- Bootstrap core JavaScript
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script> 
	    
  </body>
</html>
