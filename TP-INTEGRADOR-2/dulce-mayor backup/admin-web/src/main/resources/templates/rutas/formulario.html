<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Armar ruta')}"></head>
<body class="app-admin">
<div th:replace="~{fragments/iconos :: sprite}"></div>
<div class="velo" data-velo></div>
<div class="shell">
    <aside th:replace="~{fragments/base :: sidebar}"></aside>
    <div class="shell-main">
        <header th:replace="~{fragments/base :: topbar('Armar ruta')}"></header>
        <main class="contenido">
            <div class="encabezado-pagina mt-4">
                <div>
                    <p class="migas"><a th:href="@{/rutas}"><svg class="icono icono-sm"><use href="#i-volver"/></svg>Rutas</a></p>
                    <h1>Ruta de visitas</h1>
                    <p>Elegí el preventista, el día y los comercios. El orden de visita lo calcula su app según dónde esté.</p>
                </div>
            </div>
            <div class="alerta alerta-error mb-4" role="alert" th:if="${error != null}">
                <svg class="icono"><use href="#i-error"/></svg><span th:text="${error}">Error</span></div>

            <form class="form-pagina" th:action="@{/rutas}" th:object="${formulario}" method="post" data-envio-unico>
                <section class="tarjeta">
                    <div class="fila-campos dos">
                        <div class="campo"><label class="requerido" for="idPreventista">Preventista</label>
                            <select class="control" id="idPreventista" th:field="*{idPreventista}" required>
                                <option value="">Seleccioná un preventista</option>
                                <option th:each="p : ${preventistas}" th:value="${p.id}"
                                        th:text="${p.nombreCompleto}">Preventista</option>
                            </select></div>
                        <div class="campo"><label class="requerido" for="fecha">Fecha</label>
                            <input class="control" id="fecha" type="date" th:field="*{fecha}" required></div>
                    </div>
                </section>
                <section class="tarjeta tarjeta-tabla">
                    <div class="tarjeta-encabezado" style="padding:var(--dm-e-4) var(--dm-e-4) 0"><h2>Puntos de venta</h2></div>
                    <div class="vacio" th:if="${puntosDeVenta.isEmpty()}">
                        <p class="mb-0">Todavía no hay puntos de venta. Los da de alta el preventista desde su app.</p>
                    </div>
                    <table class="tabla tabla-apilable" th:unless="${puntosDeVenta.isEmpty()}">
                        <thead><tr><th>Comercio</th><th>Dirección</th><th>Cliente</th></tr></thead>
                        <tbody>
                        <tr th:each="pv : ${puntosDeVenta}">
                            <td class="celda-principal">
                                <label class="persona" style="cursor:pointer">
                                    <input type="checkbox" name="idsPuntoVenta" th:value="${pv.id}" th:checked="${formulario.idsPuntoVenta.contains(pv.id)}"
                                           style="width:22px;height:22px;accent-color:var(--dm-magenta)">
                                    <strong th:text="${pv.nombreFantasia}">Comercio</strong>
                                </label>
                            </td>
                            <td data-label="Dirección" th:text="${pv.direccion != null} ? ${pv.direccion.resumen} : ''">Dirección</td>
                            <td data-label="Cliente" th:text="${pv.nombreCliente}">Cliente</td>
                        </tr>
                        </tbody>
                    </table>
                </section>
                <div class="barra-acciones">
                    <a class="btn btn-fantasma" th:href="@{/rutas}">Cancelar</a>
                    <button type="submit" class="btn btn-primario">Asignar ruta</button>
                </div>
            </form>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/base :: navInferior}"></nav>
</body>
</html>
