<!DOCTYPE html>
<!-- Equivalente a PacientesPage.jsx. Datos que manda PacienteVistaController: pacientes, form, error, exito. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pacientes')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/layout :: topnav}"></nav>
<div id="layoutSidenav">
    <div th:replace="~{fragments/layout :: sidenav}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4 py-4">
                <h1 class="mt-2 mb-4">Pacientes</h1>
                <div th:replace="~{fragments/layout :: mensajes}"></div>

                <form th:action="@{/pacientes/guardar}" method="post" class="card mb-4">
                    <div class="card-header">
                        <i class="bi bi-person-plus me-2"></i>
                        <span th:text="${form.id != null and !#strings.isEmpty(form.id)} ? 'Modificar paciente' : 'Nuevo paciente'">Nuevo paciente</span>
                    </div>
                    <div class="card-body">
                        <input type="hidden" name="id" th:value="${form.id}">
                        <div class="row g-2">
                            <div class="col-md-4">
                                <input class="form-control" name="nombre" placeholder="Nombre" th:value="${form.nombre}">
                            </div>
                            <div class="col-md-4">
                                <input class="form-control" name="apellido" placeholder="Apellido" th:value="${form.apellido}">
                            </div>
                            <div class="col-md-4">
                                <input class="form-control" name="documento" placeholder="Documento" th:value="${form.documento}">
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button class="btn btn-primary" type="submit"
                                    th:text="${form.id != null and !#strings.isEmpty(form.id)} ? 'Guardar cambios' : 'Agregar'">Agregar</button>
                            <a th:if="${form.id != null and !#strings.isEmpty(form.id)}" th:href="@{/pacientes}"
                               class="btn btn-secondary">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div class="card mb-4">
                    <div class="card-header"><i class="bi bi-table me-2"></i>Listado</div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(pacientes)}" class="alert alert-light border mb-0">
                            Todavía no hay pacientes cargados.
                        </div>
                        <table th:unless="${#lists.isEmpty(pacientes)}" class="table table-striped align-middle mb-0">
                            <thead>
                            <tr><th>Apellido</th><th>Nombre</th><th>Documento</th><th>Foto</th><th class="text-end">Acciones</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${pacientes}" th:classappend="${p.id == form.id} ? 'table-warning'">
                                <td th:text="${p.apellido}">Gómez</td>
                                <td th:text="${p.nombre}">Ana</td>
                                <td th:text="${p.documento}">40111222</td>
                                <td>
                                    <!-- tieneFoto viene del PacienteDTO (lo calcula el adapter) -->
                                    <i th:if="${p.tieneFoto}" class="bi bi-camera-fill text-success" title="Tiene foto"></i>
                                    <i th:unless="${p.tieneFoto}" class="bi bi-camera text-secondary" title="Sin foto"></i>
                                </td>
                                <td class="text-end text-nowrap">
                                    <a th:href="@{/pacientes/{id}/historia(id=${p.id})}" class="btn btn-sm btn-primary" title="Historia clínica">
                                        <i class="bi bi-journal-medical me-1"></i>Historia
                                    </a>
                                    <a th:href="@{/pacientes(editar=${p.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/pacientes/eliminar}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Eliminar este paciente?');">
                                        <input type="hidden" name="id" th:value="${p.id}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
