spring.application.name=dulcemayor
server.port=${SERVER_PORT:8080}

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# PostgreSQL es el motor de desarrollo recomendado. Se puede sobrescribir DB_URL para otro entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dulcemayor}
spring.datasource.username=${DB_USERNAME:dulcemayor}
spring.datasource.password=${DB_PASSWORD:dulcemayor_dev}

# En desarrollo crea/actualiza el esquema; no desplegar a producción con estos valores predeterminados.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Las entidades se convierten a DTO dentro de los servicios (transaccion abierta).
# Se desactiva open-in-view para que ningun controlador dependa de cargas diferidas de JPA.
spring.jpa.open-in-view=false

# ===================== JWT =====================
# Clave de firma HS256: minimo 32 caracteres. OBLIGATORIO definir JWT_SECRET en produccion.
jwt.secret=${JWT_SECRET:clave-de-desarrollo-dulce-mayor-cambiar-en-produccion-2026}
# 8 horas (una jornada de trabajo), en milisegundos
jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# ===================== Jefe administrativo inicial =====================
# Se crea al iniciar si no existe ningun jefe. Clave temporal "dulcemayor": debe cambiarla al ingresar.
app.jefe-inicial.correo=${JEFE_INICIAL_CORREO:jefe@dulcemayor.com.ar}
app.jefe-inicial.nombre=${JEFE_INICIAL_NOMBRE:Jefe}
app.jefe-inicial.apellido=${JEFE_INICIAL_APELLIDO:Administrativo}
app.jefe-inicial.dni=${JEFE_INICIAL_DNI:20000000}

# ===================== OAuth2 (Google / Facebook) =====================
# Las credenciales estan en application-oauth-google.properties y application-oauth-facebook.properties
# y solo se cargan activando el perfil: SPRING_PROFILES_ACTIVE=oauth-google  (o oauth-google,oauth-facebook)
# Pagina del sitio institucional que recibe el codigo de un solo uso al terminar el ingreso social:
app.oauth2.redirect-cliente=${OAUTH2_REDIRECT_CLIENTE:http://localhost:8082/ingresar/oauth2}

# Origenes de las apps cliente (React del preventista y del distribuidor, apps Thymeleaf)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8082}

# Subida de imagenes de productos (mismo limite que el Integrador 1)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================== Pagos =====================
# Transferencia y Mercado Pago vencen a las 24 h desde la confirmacion; efectivo sostiene la reserva 7 dias.
app.pagos.transferencia.vigencia-horas=${PAGOS_TRANSFERENCIA_VIGENCIA_HORAS:24}
app.pagos.efectivo.vigencia-horas=${PAGOS_EFECTIVO_VIGENCIA_HORAS:168}
# Tarea que expira pagos vencidos y libera la reserva (se puede desactivar en pruebas).
app.pagos.expiracion-habilitada=${PAGOS_EXPIRACION_HABILITADA:true}
app.pagos.expiracion-intervalo-ms=${PAGOS_EXPIRACION_INTERVALO_MS:60000}
app.pagos.expiracion-retraso-inicial-ms=${PAGOS_EXPIRACION_RETRASO_INICIAL_MS:60000}

# Mercado Pago (Checkout Pro). Sin MERCADOPAGO_ACCESS_TOKEN la integracion informa que no esta configurada:
# nunca se simula una acreditacion. El webhook se valida con MERCADOPAGO_WEBHOOK_SECRET (firma x-signature).app.pagos.mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
app.pagos.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.pagos.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.pagos.mercadopago.notificacion-url=${MERCADOPAGO_NOTIFICACION_URL:}
app.pagos.mercadopago.ruta-preferencias=${MERCADOPAGO_RUTA_PREFERENCIAS:/preferences}
app.pagos.mercadopago.timeout-ms=${MERCADOPAGO_TIMEOUT_MS:8000}

# Datos de demostracion (opt-in): empleados, catalogo, promocion, sucursal, comercio y pedido de ejemplo.
# Se crean con la clave temporal 'dulcemayor' que debe cambiarse al ingresar.
app.datos-demo.habilitado=${DATOS_DEMO_HABILITADO:false}
# ===================== Correo (opcional) =====================
# Sin MAIL_HOST el sistema no envia correos reales: registra cada envio en la tabla envios_correo
# y en el log (modo simulado). Al definir estas variables en el .env se usa SMTP real.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.correo.remitente=${MAIL_REMITENTE:no-reply@dulcemayor.test}
app.correo.habilitado=${MAIL_HABILITADO:true}

# Newsletter: tarea programada el dia 5 de cada mes (hora local del servidor)
app.newsletter.cron=${NEWSLETTER_CRON:0 0 9 5 * *}
app.newsletter.url-sitio=${NEWSLETTER_URL_SITIO:http://localhost:8082}

# ===================== OAuth2 / OpenID Connect (cliente) =====================
# Se habilita desde el .env con APP_OAUTH2_HABILITADO=true y las credenciales del proveedor.
# Sin habilitar, la API arranca normalmente y el sitio no muestra los botones sociales.
app.oauth2.habilitado=${APP_OAUTH2_HABILITADO:false}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth2.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}