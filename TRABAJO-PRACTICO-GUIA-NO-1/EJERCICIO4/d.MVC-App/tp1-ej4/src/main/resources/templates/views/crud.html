<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/recursos :: recursos}"></th:block>
    <title>Videojuegos</title>
</head>

<body>

    <nav th:replace="~{components/navbar :: nav_bar(activo='videojuegos')}"></nav>

    <main class="container py-5 mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>Videojuegos</h1>

            <!-- Nuevo videojuego -->
            <a th:href="@{/formulario/videojuego/0}"
               class="btn btn-success"
               title="Nuevo videojuego">
                <i class="bi bi-plus-lg"></i>
            </a>

        </div>


        <!-- TABLA DE VIDEOJUEGOS -->
        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <!-- ENCABEZADO -->
                <thead class="table-primary">
                    <tr>
                        <th scope="col">Titulo</th>
                        <th scope="col">Categoria</th>
                        <th scope="col">Estudio</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col" class="text-center">Acciones</th>
                    </tr>
                </thead>

                <!-- CUERPO -->
                <tbody>

                    <tr th:each="videojuego : ${videojuegos}"
                        th:classappend="${videojuego.activo} ? '' : 'table-danger'">
                        <td th:text="${videojuego.titulo}"></td>
                        <td th:text="${videojuego.categoria.nombre}"></td>
                        <td th:text="${videojuego.estudio.nombre}"></td>
                        <td th:text="'$' + ${videojuego.precio}"></td>
                        <td th:text="${videojuego.stock}"></td>

                        <td class="text-center">

                            <a th:href="@{/formulario/videojuego/{id}(id=${videojuego.id})}"
                               class="btn btn-warning btn-sm me-1"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <a th:href="@{/eliminar/videojuego/{id}(id=${videojuego.id})}"
                               th:if="${videojuego.activo}"
                               class="btn btn-danger btn-sm"
                               title="Borrar">
                                <i class="bi bi-trash"></i>
                            </a>

                            <a th:href="@{/eliminar/videojuego/{id}(id=${videojuego.id})}"
                               th:unless="${videojuego.activo}"
                               class="btn btn-secondary btn-sm"
                               title="Reactivar">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </a>

                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <div th:replace="~{components/footer :: pie}"></div>

    <th:block th:replace="~{components/scripts :: scripts}"></th:block>

</body>
</html>
