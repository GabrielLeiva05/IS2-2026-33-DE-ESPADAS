<!DOCTYPE html>
<!-- Equivalente a MedicosPage.jsx. Datos que manda MedicoVistaController: medicos, form, error, exito. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Médicos')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/layout :: topnav}"></nav>
<div id="layoutSidenav">
    <div th:replace="~{fragments/layout :: sidenav}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4 py-4">
                <h1 class="mt-2 mb-4">Médicos</h1>
                <div th:replace="~{fragments/layout :: mensajes}"></div>

                <!-- Formulario de alta / modificación. Si form.id tiene valor, se está editando. -->
                <form th:action="@{/medicos/guardar}" method="post" class="card mb-4">
                    <div class="card-header">
                        <i class="bi bi-person-plus me-2"></i>
                        <span th:text="${form.id != null and !#strings.isEmpty(form.id)} ? 'Modificar médico' : 'Nuevo médico'">Nuevo médico</span>
                    </div>
                    <div class="card-body">
                        <!-- El id viaja oculto: vacío = alta, con valor = modificación -->
                        <input type="hidden" name="id" th:value="${form.id}">
                        <div class="row g-2">
                            <div class="col-md-4">
                                <input class="form-control" name="nombre" placeholder="Nombre" th:value="${form.nombre}">
                            </div>
                            <div class="col-md-4">
                                <input class="form-control" name="apellido" placeholder="Apellido" th:value="${form.apellido}">
                            </div>
                            <div class="col-md-4">
                                <input class="form-control" name="documento" placeholder="Documento" th:value="${form.documento}">
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button class="btn btn-primary" type="submit"
                                    th:text="${form.id != null and !#strings.isEmpty(form.id)} ? 'Guardar cambios' : 'Agregar'">Agregar</button>
                            <a th:if="${form.id != null and !#strings.isEmpty(form.id)}" th:href="@{/medicos}"
                               class="btn btn-secondary">Cancelar</a>
                        </div>
                    </div>
                </form>

                <div class="card mb-4">
                    <div class="card-header"><i class="bi bi-table me-2"></i>Listado</div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(medicos)}" class="alert alert-light border mb-0">
                            Todavía no hay médicos cargados.
                        </div>
                        <table th:unless="${#lists.isEmpty(medicos)}" class="table table-striped align-middle mb-0">
                            <thead>
                            <tr><th>Apellido</th><th>Nombre</th><th>Documento</th><th class="text-end">Acciones</th></tr>
                            </thead>
                            <tbody>
                            <!-- th:each = el .map() de React: repite la fila por cada médico -->
                            <tr th:each="m : ${medicos}" th:classappend="${m.id == form.id} ? 'table-warning'">
                                <td th:text="${m.apellido}">Pérez</td>
                                <td th:text="${m.nombre}">Juan</td>
                                <td th:text="${m.documento}">30111222</td>
                                <td class="text-end text-nowrap">
                                    <!-- Editar = volver a pedir la página con ?editar={id} -->
                                    <a th:href="@{/medicos(editar=${m.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <!-- Eliminar = un mini formulario POST por fila (los forms no tienen DELETE) -->
                                    <form th:action="@{/medicos/eliminar}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Eliminar este médico?');">
                                        <input type="hidden" name="id" th:value="${m.id}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
