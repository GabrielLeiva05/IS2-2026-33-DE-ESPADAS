# ===================== OAuth2 - Facebook (Meta) =====================
# Se carga con el perfil "oauth-facebook". Ver CONFIGURACION-OAUTH.md.
# URI de redireccion a registrar en Meta for Developers (desarrollo):
#   http://localhost:8080/login/oauth2/code/facebook
# Spring Security ya conoce los endpoints de Facebook (CommonOAuth2Provider.FACEBOOK).
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
