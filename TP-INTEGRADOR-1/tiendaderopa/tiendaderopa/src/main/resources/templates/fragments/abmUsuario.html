<section id="usuarios" class="section" th:fragment="abmUsuario">
    <div class="header">
        <h1>Usuarios</h1>
        <p>Gestión de usuarios de acceso al sistema y sus roles.</p>
    </div>

    <!-- Mensajes de Éxito o Error -->
    <div th:if="${exito != null}" class="alert alert-success" style="padding: 10px; margin-bottom: 15px; background: #d4edda; color: #155724; border-radius: 4px;">
        <p th:text="${exito}" style="margin: 0;"></p>
    </div>

    <div th:if="${error != null}" class="alert alert-danger" style="padding: 10px; margin-bottom: 15px; background: #f8d7da; color: #721c24; border-radius: 4px;">
        <p th:text="${error}" style="margin: 0;"></p>
    </div>

    <!-- Formulario (Alta / Modificación) -->
    <div class="form-container" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 25px;">

        <!-- Modo: Modificar -->
        <form th:if="${usuario != null}" th:action="@{/usuario/modificar/{id}(id=${usuario.id})}" method="POST">
            <h3>Modificar Usuario</h3>

            <div style="margin-bottom: 15px;">
                <label>ID:</label>
                <input type="text" th:value="${usuario.id}" disabled style="width: 100%; padding: 8px;" />
            </div>

            <div style="margin-bottom: 15px;">
                <label>Persona:</label>
                <input type="text" th:value="${usuario.persona != null ? usuario.persona.apellido + ', ' + usuario.persona.nombre : '-'}" disabled style="width: 100%; padding: 8px;" />
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-nombreUsuario-mod">Email (nombre de usuario):</label>
                <input type="email" id="usuario-nombreUsuario-mod" name="nombreUsuario" th:value="${usuario.nombreUsuario}" placeholder="Ej. usuario@correo.com" required style="width: 100%; padding: 8px;" />
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-rolUsuario-mod">Rol:</label>
                <select id="usuario-rolUsuario-mod" name="rolUsuario" required style="width: 100%; padding: 8px;">
                    <option value="" disabled>Seleccione una opción</option>
                    <option th:each="en : ${rolesUsuario}" th:value="${en}" th:text="${en}" th:selected="${usuario.rolUsuario == en}"></option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-clave-mod">Contraseña:</label>
                <input type="password" id="usuario-clave-mod" name="clave" placeholder="Dejar vacío para no cambiarla" style="width: 100%; padding: 8px;" />
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-clave2-mod">Repetir contraseña:</label>
                <input type="password" id="usuario-clave2-mod" name="clave2" placeholder="Dejar vacío para no cambiarla" style="width: 100%; padding: 8px;" />
            </div>

            <div>
                <button type="submit" class="btn-submit" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px;">Actualizar</button>
                <a th:href="@{/admin/dashboard}" style="margin-left: 10px; text-decoration: none; color: #555;">Cancelar</a>
            </div>
        </form>

        <!-- Modo: Registrar -->
        <form th:unless="${usuario != null}" th:action="@{/usuario/registro}" method="POST">
            <h3>Registrar Nuevo Usuario</h3>

            <div style="margin-bottom: 15px;">
                <label for="usuario-idPersona-reg">Persona:</label>
                <select id="usuario-idPersona-reg" name="idPersona" required style="width: 100%; padding: 8px;">
                    <option value="" disabled selected>Seleccione una persona sin usuario</option>
                    <option th:each="x : ${personas}" th:if="${!x.eliminado and x.usuario == null}"
                            th:value="${x.id}"
                            th:text="${x.apellido + ', ' + x.nombre + ' (' + x.documento + ')'}">
                    </option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-nombreUsuario-reg">Email (nombre de usuario):</label>
                <input type="email" id="usuario-nombreUsuario-reg" name="nombreUsuario" placeholder="Ej. usuario@correo.com" required style="width: 100%; padding: 8px;" />
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-rolUsuario-reg">Rol:</label>
                <select id="usuario-rolUsuario-reg" name="rolUsuario" required style="width: 100%; padding: 8px;">
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option th:each="en : ${rolesUsuario}" th:value="${en}" th:text="${en}"></option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-clave-reg">Contraseña:</label>
                <input type="password" id="usuario-clave-reg" name="clave" required style="width: 100%; padding: 8px;" />
            </div>
            <div style="margin-bottom: 15px;">
                <label for="usuario-clave2-reg">Repetir contraseña:</label>
                <input type="password" id="usuario-clave2-reg" name="clave2" required style="width: 100%; padding: 8px;" />
            </div>

            <div>
                <button type="submit" class="btn-submit" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px;">Guardar</button>
            </div>
        </form>

    </div>

    <!-- Listado -->
    <div class="table-container">
        <div class="table-header">
            <h2>Listado de usuarios</h2>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Persona</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${usuarios != null}" th:each="r : ${usuarios}">
                <td th:text="${r.id}">ID</td>
                <td th:text="${r.nombreUsuario}">Email</td>
                <td th:text="${r.persona != null ? r.persona.apellido + ', ' + r.persona.nombre : '-'}">Persona</td>
                <td th:text="${r.rolUsuario}">Rol</td>
                <td>
                    <span th:if="${r.eliminado}" style="color: red; font-weight: bold;">Eliminado</span>
                    <span th:unless="${r.eliminado}" style="color: green; font-weight: bold;">Activo</span>
                </td>
                <td>
                    <a th:href="@{/usuario/modificar/{id}(id=${r.id})}" class="btn-edit" style="text-decoration: none; padding: 5px 10px; background: #ffc107; color: black; border-radius: 3px;">Editar</a>
                    <a th:href="@{/usuario/eliminar/{id}(id=${r.id})}" class="btn-delete" onclick="return confirm('¿Estás seguro de eliminar este usuario?');" style="text-decoration: none; padding: 5px 10px; background: #dc3545; color: white; border-radius: 3px;">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${usuarios == null or usuarios.isEmpty()}">
                <td colspan="6" style="text-align: center;">No hay usuarios cargados en el sistema.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
