<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="main">
    <header class="header">
        <h1 th:text="${titulo}"></h1>
        <p><a th:href="@{/admin/dashboard}">Volver al panel</a></p>
    </header>

    <p class="notice success" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="notice error" th:if="${error}" th:text="${error}"></p>

    <div class="form-actions" th:if="${permitirFiltrarEstado or permitirIrANuevo or permitirCrearOrden or permitirFiltroId or permitirBuscarNombre or permitirMostrarActivos}">
        <form class="inline-form" th:if="${permitirFiltrarEstado}" method="get" th:action="${basePath}">
            <label for="estadoFiltro">Estado</label>
            <select id="estadoFiltro" name="estado">
                <option value="">Todos los estados</option>
                <option th:each="estado : ${estadosOrden}" th:value="${estado}" th:text="${estado}" th:selected="${estado == estadoSeleccionado}"></option>
            </select>
            <button class="btn-submit" type="submit">Filtrar</button>
        </form>
        <form th:if="${permitirCrearOrden}" method="post" th:action="${basePath + '/crear'}">
            <button class="btn-primary" type="submit">Abrir carrito</button>
        </form>
        <form class="inline-form" th:if="${permitirFiltroId}" method="get" th:action="${rutaFiltroId}">
            <label for="filtroId" th:text="${nombreFiltroId}"></label>
            <input id="filtroId" th:name="${nombreFiltroId}" required>
            <button class="btn-submit" type="submit">Filtrar</button>
        </form>
        <form class="inline-form" th:if="${permitirBuscarNombre}" method="get" th:action="${basePath + '/buscar'}">
            <label for="buscarNombre">Nombre</label>
            <input id="buscarNombre" name="nombre" required>
            <button class="btn-submit" type="submit">Buscar</button>
        </form>
        <a class="btn-cancel" th:if="${permitirMostrarActivos}" th:href="${basePath + '/activas'}">Ver activos</a>
        <!-- Dentro del div.form-actions existente, junto al resto: -->
        <a class="btn-primary" th:if="${permitirIrANuevo}" th:href="${basePath + '/nuevo'}">Generar nueva orden</a>
    </div>

    <section class="form-container" th:if="${permitirCrear or modoEdicion}">
        <h2 th:text="${modoEdicion ? 'Editar registro' : 'Nuevo registro'}"></h2>
        <form method="post" th:action="${accion}" enctype="multipart/form-data">
            <div class="form-group" th:each="campo : ${campos}">
                <label th:for="${campo.nombre}" th:text="${campo.etiqueta}"></label>
                <select th:if="${campo.tipo == 'select'}" th:id="${campo.nombre}" th:name="${campo.nombre}" th:required="${campo.requerido}">
                    <option value="">Seleccionar</option>
                    <option th:each="opcion : ${campo.opcionesMapa}" th:value="${opcion.key}" th:text="${opcion.value}" th:selected="${opcion.key == valores[campo.nombre]}"></option>
                </select>
                  <textarea th:if="${campo.tipo == 'textarea'}" th:id="${campo.nombre}" th:name="${campo.nombre}"
                         th:text="${valores[campo.nombre]}" th:required="${campo.requerido}"></textarea>
                  <input th:if="${campo.tipo == 'checkbox'}" type="checkbox" th:id="${campo.nombre}" th:name="${campo.nombre}"
                      value="true" th:checked="${valores[campo.nombre] == 'true'}">
                  <input th:if="${campo.tipo != 'select' and campo.tipo != 'textarea' and campo.tipo != 'checkbox'}" th:id="${campo.nombre}" th:name="${campo.nombre}"
                      th:type="${campo.tipo}" th:value="${valores[campo.nombre]}" th:required="${campo.requerido and campo.tipo != 'file'}">
            </div>
            <div class="form-actions">
                <button class="btn-submit" type="submit">Guardar</button>
                <a class="btn-cancel" th:href="${basePath}">Cancelar</a>
            </div>
        </form>
    </section>

    <section class="form-container" th:if="${permitirAgregarDetalle}">
        <h2>Agregar producto</h2>
        <form method="post" th:action="${basePath + '/' + ordenId + '/detalles'}">
            <div class="form-group">
                <label for="productoId">Producto</label>
                <select id="productoId" name="productoId" required>
                    <option value="">Seleccionar</option>
                    <option th:each="opcion : ${productosDisponibles}" th:value="${opcion.key}" th:text="${opcion.value}"></option>
                </select>
            </div>
            <div class="form-group"><label for="cantidad">Cantidad</label><input id="cantidad" name="cantidad" type="number" min="1" value="1" required></div>
            <!-- Dentro de la sección "Agregar producto" existente, un campo más: -->
            <div class="form-group" th:if="${permitirPrecioCompra}">
                <label for="precioCompra">Precio de compra</label>
                <input id="precioCompra" name="precioCompra" type="number" step="0.01" min="0.01" required>
            </div>
            <button class="btn-submit" type="submit">Agregar</button>
        </form>
    </section>
    <!-- Sección nueva, junto a la de "Agregar producto": -->
    <section class="form-container" th:if="${permitirConfirmarOrden}">
        <h2>Confirmar orden de compra</h2>
        <form method="post" th:action="${basePath + '/' + ordenId + '/confirmar'}">
            <div class="form-group">
                <label for="idFormaDePago">Forma de pago</label>
                <select id="idFormaDePago" name="idFormaDePago" required>
                    <option value="">Seleccionar</option>
                    <option th:each="opcion : ${formasDePagoDisponibles}" th:value="${opcion.key}" th:text="${opcion.value}"></option>
                </select>
            </div>
            <button class="btn-primary" type="submit">Aceptar</button>
        </form>
    </section>

    <section class="form-container" th:if="${accionSecundaria != null}">
        <h2>Enviar correo</h2>
        <form method="post" th:action="${accionSecundaria}">
            <div class="form-group" th:each="campo : ${camposSecundarios}">
                <label th:for="${campo.nombre}" th:text="${campo.etiqueta}"></label>
                <textarea th:if="${campo.tipo == 'textarea'}" th:id="${campo.nombre}" th:name="${campo.nombre}" th:required="${campo.requerido}"></textarea>
                <input th:if="${campo.tipo != 'textarea'}" th:id="${campo.nombre}" th:name="${campo.nombre}" th:type="${campo.tipo}" th:required="${campo.requerido}">
            </div>
            <button class="btn-submit" type="submit">Enviar</button>
        </form>
    </section>

    <section class="table-container">
        <div class="table-header"><h2>Registros</h2></div>
        <div class="table-scroll">
            <table>
                <thead><tr><th th:each="columna : ${columnas}" th:text="${columna.etiqueta}"></th><th>Acciones</th></tr></thead>
                <tbody>
                <tr th:each="fila : ${filas}">
                    <td th:each="columna : ${columnas}" th:text="${fila[columna.clave]}"></td>
                    <td class="row-actions">
                        <a class="btn-cancel" th:if="${permitirVerDetalle}" th:href="${detallePath + '/' + fila['id']}">Ver</a>
                        <a class="btn-edit" th:if="${permitirEditar}" th:href="${basePath + '/' + fila['id'] + '/editar'}">Editar</a>
                        <form method="post" th:if="${permitirEliminar}" th:action="${basePath + '/' + fila['id'] + '/eliminar'}">
                            <button class="btn-delete" type="submit">Eliminar</button>
                        </form>
                        <form method="post" th:if="${asociacionUsuarios}" th:action="${basePath + '/' + fila['id'] + '/usuario'}">
                            <label class="visually-hidden" th:for="${'usuario-' + fila['id']}">Usuario</label>
                            <select th:id="${'usuario-' + fila['id']}" name="usuarioId" required>
                                <option value="">Seleccionar usuario</option>
                                <option th:each="opcion : ${usuariosDisponibles}" th:value="${opcion.key}" th:text="${opcion.value}"></option>
                            </select>
                            <button class="btn-submit" type="submit">Asociar</button>
                        </form>
                        <form method="post" th:if="${desasociarUsuarios}" th:action="${basePath + '/' + fila['id'] + '/usuario/eliminar'}">
                            <button class="btn-cancel" type="submit">Desasociar</button>
                        </form>
                        <form method="post" th:if="${permitirCambiarEstado}" th:action="${basePath + '/' + fila['id'] + '/estado'}">
                            <select name="estado" aria-label="Cambiar estado de orden">
                                <option th:each="estado : ${estadosOrden}" th:value="${estado}" th:text="${estado}" th:selected="${estado == fila['estadoOrdenCompra']}"></option>
                            </select>
                            <button class="btn-submit" type="submit">Actualizar estado</button>
                        </form>
                        <form method="post" th:if="${permitirAnular and fila['estadoOrdenCompra'] == 'PENDIENTE_DE_PAGO'}" th:action="${basePath + '/' + fila['id'] + '/anular'}">
                            <button class="btn-delete" type="submit">Anular</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(filas)}"><td th:colspan="${#lists.size(columnas) + 1}">No hay registros.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
