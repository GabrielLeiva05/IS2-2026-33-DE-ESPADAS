# ===================== Perfil de PRODUCCION =====================
# Activar con SPRING_PROFILES_ACTIVE=prod (o prod,oauth-google,oauth-facebook).
# Sin valores por defecto para los secretos: si falta una variable, la aplicacion NO arranca.
jwt.secret=${JWT_SECRET}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.oauth2.redirect-cliente=${OAUTH2_REDIRECT_CLIENTE}
# Detras de un proxy inverso (Nginx, balanceador) que termina HTTPS: respetar X-Forwarded-Proto/Host
# para que Spring arme las URI de redireccion de OAuth2 con https y el dominio publico.
server.forward-headers-strategy=framework
