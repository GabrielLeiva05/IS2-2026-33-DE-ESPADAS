spring.application.name=tiendaderopa

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tiendaderopa}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

mail.username=${MAIL_USERNAME:}
mail.host=smtp.gmail.com
mail.tls=true
mail.port=587
mail.password=${MAIL_PASSWORD:}

app.base-url=${APP_BASE_URL:http://localhost:8080}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}
mercadopago.sandbox=${MERCADOPAGO_SANDBOX:false}
app.demo.password=${APP_DEMO_PASSWORD:Zero2026!}

# Subida de imagenes de productos (el limite por defecto de Spring es 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
