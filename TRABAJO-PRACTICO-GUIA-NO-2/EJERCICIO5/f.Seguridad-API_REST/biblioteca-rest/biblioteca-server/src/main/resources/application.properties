# ============================================================
#  SERVIDOR REST - Biblioteca
# ============================================================
spring.application.name=biblioteca-server
server.port=8080

# --- Base de datos por defecto: H2 en memoria (no requiere instalar nada) ---
spring.datasource.url=jdbc:h2:mem:bibliotecadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Credenciales de ejemplo para desarrollo local; reemplazarlas mediante variables de entorno.
biblioteca.security.username=${BIBLIOTECA_API_USERNAME:cliente}
biblioteca.security.password=${BIBLIOTECA_API_PASSWORD:cambiar-esta-clave}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Se desactiva "open-in-view": toda la información se carga dentro de la capa de servicios (@Transactional)
spring.jpa.open-in-view=false

# --- Logs ---
logging.level.ar.com.biblioteca=INFO
