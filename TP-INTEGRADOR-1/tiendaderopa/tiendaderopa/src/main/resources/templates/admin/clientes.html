<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
<main class="main">
    <header class="header">
        <h1>Clientes</h1>
        <p>Administración de clientes registrados</p>
    </header>

    <p class="notice success" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="notice error" th:if="${error}" th:text="${error}"></p>

    <section class="table-container">
        <div class="table-header">
            <h2>Listado</h2>
            <div class="form-actions">
                <a class="btn-primary" th:href="@{/admin/clientes/nuevo}">Nuevo cliente</a>
                <a class="btn-cancel" th:if="${!incluirInactivos}" th:href="@{/admin/clientes(incluirInactivos=true)}">Incluir inactivos</a>
                <a class="btn-cancel" th:if="${incluirInactivos}" th:href="@{/admin/clientes}">Solo activos</a>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr><th>Nombre</th><th>Documento</th><th>Fecha de nacimiento</th><th>Dirección</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.nombre + ' ' + cliente.apellido}"></td>
                    <td th:text="${cliente.tipoDocumento + ' ' + cliente.documento}"></td>
                    <td th:text="${cliente.fechaNacimiento != null ? #dates.format(cliente.fechaNacimiento, 'dd/MM/yyyy') : '-'}"></td>
                    <td th:text="${cliente.direccionEstadia ?: '-'}"></td>
                    <td class="row-actions">
                        <a class="btn-edit" th:href="@{/admin/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
                        <form th:action="@{/admin/clientes/{id}/asociar-usuario(id=${cliente.id})}" method="post">
                            <label class="visually-hidden" th:for="${'usuario-' + cliente.id}">ID de usuario</label>
                            <input th:id="${'usuario-' + cliente.id}" name="usuarioId" required placeholder="ID de usuario">
                            <button class="btn-submit" type="submit">Asociar usuario</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5">No hay clientes para mostrar.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
