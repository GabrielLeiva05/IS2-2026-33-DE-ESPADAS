services:

  # ==========================================
  # BASE DE DATOS
  # ==========================================
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dulcemayor
      MYSQL_USER: dulcemayor_app
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}

    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50

    volumes:
      - dbdata:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ==========================================
  # BACKEND SPRING BOOT
  # ==========================================
  backend:
    build:
      context: ../codigo/TP-INTEGRADOR-2/dulce-mayor
      dockerfile: /opt/dulce-mayor/deploy/Dockerfile.java
      args:
        MODULE: backend

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC"

      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:mysql://db:3306/dulcemayor?createDatabaseIfNotExist=true
      DB_USERNAME: dulcemayor_app
      DB_PASSWORD: ${DB_APP_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JPA_DDL_AUTO: update

      JEFE_INICIAL_CORREO: ${JEFE_INICIAL_CORREO}

      CORS_ALLOWED_ORIGINS: "https://dulcemayor.duckdns.org,https://dulcemayor-admin.duckdns.org,https://dulcemayor-preventista.duckdns.org,https://dulcemayor-distribuidor.duckdns.org"

      OAUTH2_REDIRECT_CLIENTE: https://dulcemayor.duckdns.org/ingresar/oauth2

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}

      MAPAS_USER_AGENT: ${MAPAS_USER_AGENT}

      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_USER_ID: ${MP_USER_ID:-}
      MP_EXTERNAL_POS_ID: ${MP_EXTERNAL_POS_ID:-DULCEMAYOR-POS}
      MP_NOTIFICATION_URL: https://dulcemayor-api.duckdns.org/api/pagos/mercadopago/webhook
      MP_BASE_URL: https://api.mercadopago.com

      ALIAS_TRANSFERENCIA: ${ALIAS_TRANSFERENCIA:-dulcemayor.mp}
      TITULAR_TRANSFERENCIA: ${TITULAR_TRANSFERENCIA:-Dulce Mayor S.A.}

      CORREO_HABILITADO: ${CORREO_HABILITADO:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-no-responder@dulcemayor.duckdns.org}
      CORREO_NOMBRE_REMITENTE: Dulce Mayor

  # ==========================================
  # PANEL ADMINISTRATIVO
  # ==========================================
  admin-web:
    build:
      context: ../codigo/TP-INTEGRADOR-2/dulce-mayor
      dockerfile: /opt/dulce-mayor/deploy/Dockerfile.java
      args:
        MODULE: admin-web

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

      SERVER_PORT: 8081
      API_BASE_URL: http://backend:8080
      API_PUBLIC_URL: https://dulcemayor-api.duckdns.org
      SITIO_URL: https://dulcemayor.duckdns.org

      COOKIE_SECURE: "true"
      SESSION_TIMEOUT: 60m
      SESSION_COOKIE_MAX_AGE: 8h

      THYMELEAF_CACHE: "true"
      FORWARD_HEADERS_STRATEGY: framework

  # ==========================================
  # SITIO INSTITUCIONAL
  # ==========================================
  institucional-web:
    build:
      context: ../codigo/TP-INTEGRADOR-2/dulce-mayor
      dockerfile: /opt/dulce-mayor/deploy/Dockerfile.java
      args:
        MODULE: institucional-web

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "127.0.0.1:8082:8082"

    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"

      SERVER_PORT: 8082
      API_BASE_URL: http://backend:8080
      API_PUBLIC_URL: https://dulcemayor-api.duckdns.org

      OAUTH_GOOGLE_HABILITADO: "false"
      OAUTH_FACEBOOK_HABILITADO: "false"

      COOKIE_SECURE: "true"
      SESSION_TIMEOUT: 60m
      SESSION_COOKIE_MAX_AGE: 8h

      THYMELEAF_CACHE: "true"
      FORWARD_HEADERS_STRATEGY: framework

  # ==========================================
  # FRONTEND PREVENTISTA
  # ==========================================
  preventista:
    build:
      context: ../codigo/TP-INTEGRADOR-2/dulce-mayor/movil
      dockerfile: /opt/dulce-mayor/deploy/Dockerfile.frontend
      args:
        APP: preventista
        VITE_API_URL: https://dulcemayor-api.duckdns.org

    restart: unless-stopped

    ports:
      - "127.0.0.1:8083:80"

  # ==========================================
  # FRONTEND DISTRIBUIDOR
  # ==========================================
  distribuidor:
    build:
      context: ../codigo/TP-INTEGRADOR-2/dulce-mayor/movil
      dockerfile: /opt/dulce-mayor/deploy/Dockerfile.frontend
      args:
        APP: distribuidor
        VITE_API_URL: https://dulcemayor-api.duckdns.org

    restart: unless-stopped

    ports:
      - "127.0.0.1:8084:80"

volumes:
  dbdata: