spring.application.name=blockazo
server.port=8080

# ===================== Base de datos (MySQL) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/blockazo?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2003}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===================== JWT =====================
# La clave debe tener al menos 32 caracteres (HS256). Cambiarla en produccion.
jwt.secret=${JWT_SECRET:CLAVE_SECRETA_SUPER_SEGURA_BLOCKAZO_SPRING_BOOT_JWT_2026_KEY}
# 24 horas en milisegundos
jwt.expiration=86400000

# ===================== OAuth2 - Google =====================
# Crear credenciales en https://console.cloud.google.com/apis/credentials
# URIs de redireccion autorizadas (cargar LAS DOS en Google Cloud):
#   http://localhost:5173/login/oauth2/code/google   (desarrollo, a traves del proxy de Vite)
#   http://localhost:8080/login/oauth2/code/google   (frontend compilado servido por Spring)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===================== OAuth2 - Auth0 (opcional) =====================
# Descomentar y completar si se quiere usar Auth0 como proveedor.
# Callback en Auth0: http://localhost:8080/login/oauth2/code/auth0
#spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
#spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
#spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
#spring.security.oauth2.client.provider.auth0.issuer-uri=https://TU-DOMINIO.us.auth0.com/

# ===================== Frontend =====================
# Origenes permitidos por CORS (separados por coma). En desarrollo el frontend usa el
# proxy de Vite (mismo origen), asi que CORS solo hace falta si se llama a la API directo.
app.frontend.url=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
# Pagina del frontend que recibe el token luego del login con Google (?token=...).
# Es RELATIVA: vuelve al mismo origen desde el que se inicio el login
# (http://localhost:5173 en desarrollo con Vite, http://localhost:8080 con el frontend compilado).
app.frontend.oauth2-redirect=${FRONTEND_OAUTH2_REDIRECT:/auth/callback}

# ===================== Usuario administrador inicial =====================
app.admin.correo=admin@blockazo.com
app.admin.clave=admin123
