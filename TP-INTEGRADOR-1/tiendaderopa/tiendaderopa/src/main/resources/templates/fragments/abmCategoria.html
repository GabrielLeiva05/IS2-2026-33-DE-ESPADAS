<section id="categorias" class="section" th:fragment="abmCategoria">
    <div class="header">
        <h1>Categorías</h1>
        <p>Gestión y administración de categorías de productos.</p>
    </div>

    <p class="notice success" th:if="${exito != null}" th:text="${exito}"></p>
    <p class="notice error" th:if="${error != null}" th:text="${error}"></p>

    <!-- Formulario (Alta / Modificación) -->
    <section class="form-container">

        <!-- Modo: Modificar Categoría -->
        <form th:if="${categoria != null}" th:action="@{/admin/abm/categoria/modificar/{id}(id=${categoria.id})}" method="POST">
            <h3>Modificar categoría</h3>

            <div class="form-group">
                <label for="nombre-cat-mod">Nombre de la categoría</label>
                <input type="text" id="nombre-cat-mod" name="nombre" th:value="${categoria.nombre}" placeholder="Ej. Remeras" required />
            </div>

            <div class="form-group">
                <label for="activo-cat-mod"><input type="checkbox" id="activo-cat-mod" name="activo" value="true" th:checked="${categoria.activo}" /> Categoría activa</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Actualizar</button>
                <a class="btn-cancel" th:href="@{/admin/dashboard}">Cancelar</a>
            </div>
        </form>

        <!-- Modo: Registrar Nueva Categoría -->
        <form th:unless="${categoria != null}" th:action="@{/admin/abm/categoria/registro}" method="POST">
            <h3>Registrar nueva categoría</h3>

            <div class="form-group">
                <label for="nombre-cat-reg">Nombre de la categoría</label>
                <input type="text" id="nombre-cat-reg" name="nombre" placeholder="Ej. Remeras" required />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Guardar</button>
            </div>
        </form>

    </section>

    <!-- Listado de categorías -->
    <section class="table-container">
        <div class="table-header">
            <h2>Listado de categorías</h2>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${categorias != null}" th:each="r : ${categorias}">
                    <td th:text="${r.nombre}">Nombre</td>
                    <td>
                        <span th:unless="${r.activo}" class="estado estado-eliminado">Inactivo</span>
                        <span th:if="${r.activo}" class="estado estado-activo">Activo</span>
                    </td>
                    <td class="row-actions">
                        <a th:href="@{/admin/abm/categoria/modificar/{id}(id=${r.id})}" class="btn-edit">Editar</a>
                        <a th:if="${r.activo}" th:href="@{/admin/abm/categoria/eliminar/{id}(id=${r.id})}" class="btn-delete" onclick="return confirm('¿Estás seguro de desactivar esta categoría?');">Desactivar</a>
                    </td>
                </tr>
                <tr th:if="${categorias == null or categorias.isEmpty()}">
                    <td colspan="3">No hay categorías cargados en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
