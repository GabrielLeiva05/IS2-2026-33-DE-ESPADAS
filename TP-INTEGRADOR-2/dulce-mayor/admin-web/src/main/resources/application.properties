spring.application.name=admin-web

# Puerto de admin-web (la API usa 8080 y el sitio institucional 8082)
server.port=${SERVER_PORT:8081}

# URL con la que admin-web llama a la API desde el servidor
api.base-url=${API_BASE_URL:http://localhost:8080}
# URL de la API vista desde el navegador (imágenes de productos). En producción, el dominio público.
api.public-url=${API_PUBLIC_URL:http://localhost:8080}
# Sitio institucional, para derivar a los clientes
app.sitio-url=${SITIO_URL:http://localhost:8082}

# Sesión del servidor: el JWT se guarda aquí y nunca llega al navegador.
# Nombre propio de cookie: el navegador comparte cookies entre puertos de localhost.
server.servlet.session.cookie.name=DM_ADMIN_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# Persistencia de sesión (corrección Ola 1): la sesión vence tras SESSION_TIMEOUT sin actividad, y la cookie es
# persistente (SESSION_COOKIE_MAX_AGE) para que cerrar y volver a abrir el navegador no obligue a ingresar de nuevo.
# El JWT guardado en la sesión vence a las 8 h (backend): ahí se vuelve a pedir el ingreso.
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}
server.servlet.session.cookie.max-age=${SESSION_COOKIE_MAX_AGE:8h}
server.servlet.session.tracking-modes=cookie

# En producción conviene activar la caché de plantillas (THYMELEAF_CACHE=true)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
# Detrás de un proxy inverso con HTTPS
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
