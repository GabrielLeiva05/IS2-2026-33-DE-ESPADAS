<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi carrito')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/menubody :: menu-principal}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>

<section class="py-5" th:with="vacio=${carrito == null or #lists.isEmpty(carrito.detallesActivos)}">
    <div class="container px-4 px-lg-5">
        <h2 class="fw-bolder mb-4"><i class="bi-cart-fill"></i> Mi carrito</h2>

        <div th:if="${vacio}" class="text-center py-5">
            <p class="lead text-muted">Tu carrito está vacío.</p>
            <a class="btn btn-dark" th:href="@{/}">Ir a la tienda</a>
        </div>

        <div th:unless="${vacio}">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Artículo</th>
                        <th>Proveedor</th>
                        <th class="text-end">Precio</th>
                        <th class="text-end">Quitar</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${carrito.detallesActivos}">
                        <td th:text="${d.articulo.nombre}">Articulo</td>
                        <td class="text-muted" th:text="${d.articulo.proveedor.nombre}">Proveedor</td>
                        <td class="text-end" th:text="'$ ' + ${#numbers.formatDecimal(d.articulo.precio, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                        <td class="text-end">
                            <form th:action="@{/carrito/detalle/{id}/quitar(id=${d.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit" title="Quitar"><i class="bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="2" class="text-end fs-5">Total</th>
                        <th class="text-end fs-5" th:text="'$ ' + ${#numbers.formatDecimal(carrito.total, 1, 'POINT', 2, 'COMMA')}">$ 0,00</th>
                        <th></th>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <div class="d-flex flex-wrap gap-2 justify-content-between">
                <a class="btn btn-outline-dark" th:href="@{/}">Seguir comprando</a>
                <div class="d-flex gap-2">
                    <form th:action="@{/carrito/vaciar}" method="post" onsubmit="return confirm('¿Vaciar el carrito?');">
                        <button class="btn btn-outline-danger" type="submit">Vaciar carrito</button>
                    </form>
                    <form th:action="@{/carrito/confirmar}" method="post">
                        <button class="btn btn-dark" type="submit">Confirmar compra</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/footer :: pie-pagina}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
