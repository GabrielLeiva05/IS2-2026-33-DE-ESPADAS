spring.application.name=dulcemayor
server.port=${SERVER_PORT:8080}

spring.config.import=optional:file:.env[.properties]

# Misma estrategia que el Integrador 1: los valores se toman de variables de entorno o del archivo .env
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dulcemayor?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# update conserva los datos entre reinicios. Usar JPA_DDL_AUTO=create para recrear el esquema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Las entidades se convierten a DTO dentro de los servicios (transaccion abierta).
# Se desactiva open-in-view para que ningun controlador dependa de cargas diferidas de JPA.
spring.jpa.open-in-view=false

# ===================== JWT =====================
# Clave de firma HS256: minimo 32 caracteres. OBLIGATORIO definir JWT_SECRET en produccion.
jwt.secret=${JWT_SECRET:clave-de-desarrollo-dulce-mayor-cambiar-en-produccion-2026}
# 8 horas (una jornada de trabajo), en milisegundos
jwt.expiration=${JWT_EXPIRATION_MS:28800000}
# Duración máxima de una sesión desde el ingreso (las apps pueden renovar el token hasta este límite): 24 h
jwt.sesion-maxima=${JWT_SESION_MAXIMA_MS:86400000}

# ===================== Jefe administrativo inicial =====================
# Se crea al iniciar si no existe ningun jefe. Clave temporal "dulcemayor": debe cambiarla al ingresar.
app.jefe-inicial.correo=${JEFE_INICIAL_CORREO:jefe@dulcemayor.com.ar}
app.jefe-inicial.nombre=${JEFE_INICIAL_NOMBRE:Jefe}
app.jefe-inicial.apellido=${JEFE_INICIAL_APELLIDO:Administrativo}
app.jefe-inicial.dni=${JEFE_INICIAL_DNI:20000000}

# ===================== OAuth2 (Google / Facebook) =====================
# Las credenciales estan en application-oauth-google.properties y application-oauth-facebook.properties
# y solo se cargan activando el perfil: SPRING_PROFILES_ACTIVE=oauth-google  (o oauth-google,oauth-facebook)
# Pagina del sitio institucional que recibe el codigo de un solo uso al terminar el ingreso social:
app.oauth2.redirect-cliente=${OAUTH2_REDIRECT_CLIENTE:http://localhost:8082/ingresar/oauth2}

# Origenes de las apps cliente (React del preventista y del distribuidor, apps Thymeleaf)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8082}
# 5173 = app React del preventista, 5174 = app React del distribuidor

# ===================== Mapas (OpenStreetMap) =====================
# El mapa lo dibuja Leaflet en el navegador con las teselas de OpenStreetMap.
# Geocodificacion (direccion <-> coordenadas): Nominatim. Politica de uso del servidor publico:
#   maximo 1 consulta por segundo, User-Agent que identifique a la aplicacion con un contacto, sin uso masivo.
#   https://operations.osmfoundation.org/policies/nominatim/
app.mapas.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
# Recorrido por calles: OSRM. El servidor publico es SOLO para demostraciones (sin garantia de disponibilidad).
app.mapas.osrm-url=${OSRM_URL:https://router.project-osrm.org}
# Completar con un correo de contacto real del equipo (lo exige la politica de Nominatim)
app.mapas.user-agent=${MAPAS_USER_AGENT:DulceMayor/1.0 (trabajo practico integrador; contacto: completar-correo)}
app.mapas.pais=ar
# Orden de las paradas (preventista y distribuidor): matriz de tiempos de OSRM (/table/v1/driving) + optimizador
# propio (exacto hasta 12 paradas, vecino mas cercano + 2-opt con mas). Usa la misma OSRM_URL. Ver README, secciones 13 a 15.

# ===================== Facturacion (Ola 3) =====================
# Alicuota de IVA que se discrimina en las facturas (0.21 = 21 %). El PDF se genera con JasperReports usando
# el DataSource de Spring: las plantillas (reportes/*.jrxml) no tienen credenciales.
app.facturacion.alicuota-iva=${FACTURACION_ALICUOTA_IVA:0.21}

# Subida de imagenes de productos (mismo limite que el Integrador 1)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
