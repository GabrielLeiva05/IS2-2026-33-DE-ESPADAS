<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/recursos :: recursos}"></th:block>
    <title>Pagina de errores</title>
</head>
<body>
    <nav th:replace="~{components/navbar :: nav_bar(activo='')}"></nav>
    <div class="container py-5 mt-5">
        <div class="row">
            <div class="col">
                <div class="alert alert-danger mt-5" role="alert" th:if="${error}">
                    <span th:text="${error}"></span>
                </div>
                <div class="alert alert-danger mt-5" role="alert" th:unless="${error}">
                    Hubo un error
                </div>
            </div>
        </div>
    </div>
    <th:block th:replace="~{components/scripts :: scripts}"></th:block>
</body>
</html>
