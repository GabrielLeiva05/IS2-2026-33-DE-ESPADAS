spring.application.name=institucional-web

# Puerto del sitio institucional (la API usa 8080 y admin-web 8081)
server.port=${SERVER_PORT:8082}

# URL con la que el sitio llama a la API desde el servidor
api.base-url=${API_BASE_URL:http://localhost:8080}
# URL de la API vista desde el navegador: imágenes y botones de Google/Facebook (/oauth2/authorization/...)
api.public-url=${API_PUBLIC_URL:http://localhost:8080}

# Botones de ingreso con redes sociales. Activarlos solo cuando la API corre con el perfil
# oauth-google / oauth-facebook y las credenciales están configuradas (ver CONFIGURACION-OAUTH.md).
app.oauth.google.habilitado=${OAUTH_GOOGLE_HABILITADO:false}
app.oauth.facebook.habilitado=${OAUTH_FACEBOOK_HABILITADO:false}

# Sesión del servidor: el JWT queda aquí y nunca llega al navegador.
server.servlet.session.cookie.name=DM_SITIO_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# ===================== Configuracion desde archivo .env =====================
# Toda la configuracion puede definirse en un archivo ".env" (misma carpeta que pom.xml) o en el
# .env compartido de la raiz del proyecto, sin tocar variables de entorno del sistema operativo.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]