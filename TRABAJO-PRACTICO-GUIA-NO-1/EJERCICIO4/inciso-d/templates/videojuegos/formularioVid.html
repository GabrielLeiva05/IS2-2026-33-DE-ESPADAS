    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-5 mt-5">

        <h1 class="mb-4">Agregar Videojuego</h1>

        <form>

            <!-- Título y Categoría -->
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="titulo" class="form-label">
                        Nombre del videojuego
                    </label>

                    <input type="text"
                           class="form-control"
                           id="titulo"
                           placeholder="Ej: GTA VI">
                </div>


                <div class="col-md-6 mb-3">
                    <label for="categoria" class="form-label">
                        Categoría
                    </label>

                    <select id="categoria" class="form-select">

                        <option selected disabled>
                            Seleccionar categoría
                        </option>

                        <option>MMORPG</option>
                        <option>Survival</option>
                        <option>Acción</option>

                    </select>
                </div>

            </div>


            <!-- Estudio y precio -->
            <div class="row">

                <div class="col-md-6 mb-3">

                    <label for="estudio" class="form-label">
                        Estudio
                    </label>

                    <select id="estudio" class="form-select">

                        <option selected disabled>
                            Seleccionar estudio
                        </option>

                        <option>Blizzard</option>
                        <option>Mojang</option>
                        <option>Rockstar</option>

                    </select>

                </div>


                <div class="col-md-6 mb-3">

                    <label for="precio" class="form-label">
                        Precio
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">$</span>

                        <input type="number"
                               class="form-control"
                               id="precio"
                               placeholder="49.99"
                               step="0.01"
                               min="0">

                    </div>

                </div>

            </div>


            <!-- Cantidad y fecha de lanzamiento -->
            <div class="row">

                <div class="col-md-6 mb-3">

                    <label for="cantidad" class="form-label">
                        Cantidad disponible
                    </label>

                    <input type="number"
                           class="form-control"
                           id="cantidad"
                           placeholder="10"
                           min="0">

                </div>


                <div class="col-md-6 mb-3">

                    <label for="lanzamiento" class="form-label">
                        Fecha de lanzamiento
                    </label>

                    <input type="date"
                           class="form-control"
                           id="lanzamiento">

                </div>

            </div>


            <!-- Descripción -->
            <div class="mb-3">

                <label for="descripcion" class="form-label">
                    Descripción
                </label>

                <textarea class="form-control"
                          id="descripcion"
                          rows="4"
                          placeholder="Ingrese una descripción del videojuego"></textarea>

            </div>


            <!-- Imagen -->
            <div class="mb-3">

                <label for="imagen" class="form-label">
                    Imagen del videojuego
                </label>

                <input type="file"
                       class="form-control"
                       id="imagen"
                       accept="image/*">

            </div>


            <!-- Oferta -->
            <div class="mb-3">

                <label class="form-label d-block">
                    ¿El videojuego está en oferta?
                </label>

                <div class="form-check form-check-inline">

                    <input class="form-check-input"
                           type="radio"
                           name="oferta"
                           id="ofertaSi"
                           value="true">

                    <label class="form-check-label" for="ofertaSi">
                        Sí
                    </label>

                </div>


                <div class="form-check form-check-inline">

                    <input class="form-check-input"
                           type="radio"
                           name="oferta"
                           id="ofertaNo"
                           value="false"
                           checked>

                    <label class="form-check-label" for="ofertaNo">
                        No
                    </label>

                </div>

            </div>



            <!-- Botones -->
            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i>
                    Guardar
                </button>


            </div>

        </form>

    </main>
