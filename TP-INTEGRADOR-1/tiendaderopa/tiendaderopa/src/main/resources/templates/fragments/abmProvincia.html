<section id="provincias" class="section" th:fragment = "abmProvincia">
    <div class="header">
        <h1>Provincias</h1>
        <p>Gestión y administración de provincias por país.</p>
    </div>

    <p class="notice success" th:if="${exito != null}" th:text="${exito}"></p>
    <p class="notice error" th:if="${error != null}" th:text="${error}"></p>

    <!-- Formulario (Alta / Modificación) -->
    <section class="form-container">

        <!-- Modo: Modificar Provincia -->
        <form th:if="${provincia != null}" th:action="@{/provincia/modificar/{id}(id=${provincia.id})}" method="POST">
            <h3>Modificar provincia</h3>

            <div class="form-group">
                <label for="nombre-prov-mod">Nombre de la provincia</label>
                <input type="text" id="nombre-prov-mod" name="nombre" th:value="${provincia.nombre}" placeholder="Ej. Mendoza" required />
            </div>

            <div class="form-group">
                <label for="pais-prov-mod">País al que pertenece</label>
                <select id="pais-prov-mod" name="idPais" required>
                    <option value="" disabled>Seleccione un país</option>
                    <option th:each="p : ${paises}"
                            th:value="${p.id}"
                            th:text="${p.nombre}"
                            th:selected="${provincia.pais != null and provincia.pais.id == p.id}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Actualizar</button>
                <a class="btn-cancel" th:href="@{/admin/dashboard}">Cancelar</a>
            </div>
        </form>

        <!-- Modo: Registrar Nueva Provincia -->
        <form th:unless="${provincia != null}" th:action="@{/provincia/registro}" method="POST">
            <h3>Registrar nueva provincia</h3>

            <div class="form-group">
                <label for="nombre-prov-reg">Nombre de la provincia</label>
                <input type="text" id="nombre-prov-reg" name="nombre" placeholder="Ej. Mendoza" required />
            </div>

            <div class="form-group">
                <label for="pais-prov-reg">País al que pertenece</label>
                <select id="pais-prov-reg" name="idPais" required>
                    <option value="" disabled selected>Seleccione un país</option>
                    <option th:each="p : ${paises}"
                            th:if="${!p.eliminado}"
                            th:value="${p.id}"
                            th:text="${p.nombre}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Guardar</button>
            </div>
        </form>

    </section>

    <!-- Listado de Provincias -->
    <section class="table-container">
        <div class="table-header">
            <h2>Listado de provincias</h2>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>País</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${provincias != null}" th:each="pr : ${provincias}">
                    <td th:text="${pr.nombre}">Nombre</td>
                    <td th:text="${pr.pais != null ? pr.pais.nombre : 'Sin país'}">País</td>
                    <td>
                        <span th:if="${pr.eliminado}" class="estado estado-eliminado">Eliminada</span>
                        <span th:unless="${pr.eliminado}" class="estado estado-activo">Activa</span>
                    </td>
                    <td class="row-actions">
                        <a th:href="@{/provincia/modificar/{id}(id=${pr.id})}" class="btn-edit">Editar</a>
                        <a th:href="@{/provincia/eliminar/{id}(id=${pr.id})}" class="btn-delete" onclick="return confirm('¿Estás seguro de eliminar esta provincia?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${provincias == null or #lists.isEmpty(provincias)}">
                    <td colspan="4">No hay provincias cargadas en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
