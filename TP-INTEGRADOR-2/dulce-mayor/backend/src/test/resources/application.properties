# Pruebas de integracion: H2 en memoria (no necesita MySQL). Igual que Blockazo.
spring.datasource.url=jdbc:h2:mem:dulcemayor;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=clave-de-pruebas-dulce-mayor-con-mas-de-32-caracteres
jwt.expiration=3600000
app.jefe-inicial.correo=jefe@dulcemayor.test
app.jefe-inicial.nombre=Jefe
app.jefe-inicial.apellido=Pruebas
app.jefe-inicial.dni=20000000
app.oauth2.redirect-cliente=http://localhost:8082/ingresar/oauth2
app.cors.allowed-origins=http://localhost:5173

# Pagos: en pruebas no corre la tarea de vencimiento y Mercado Pago queda sin credenciales
app.pagos.expiracion-habilitada=false
