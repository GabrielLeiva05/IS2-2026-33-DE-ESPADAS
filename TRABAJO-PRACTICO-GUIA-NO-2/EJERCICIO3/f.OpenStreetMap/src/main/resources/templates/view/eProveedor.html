<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titleEdit})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/menubody :: menu-principal}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>
<th:block th:replace="~{fragments/layout :: leaflet-css}"></th:block>

<section class="py-5">
    <div class="container px-4 px-lg-5" style="max-width: 640px;">
        <h2 class="fw-bolder mb-4" th:text="${titleEdit}">Proveedor</h2>
        <form th:action="@{${basePath} + '/actualizar'}" th:object="${item}" method="post" class="card card-body p-4">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre</label>
                <input class="form-control" id="nombre" th:field="*{nombre}" maxlength="100" th:disabled="${isDisabled}" required autofocus />
            </div>

            <!-- Ubicacion (OpenStreetMap + Leaflet) -->
            <div class="mb-3">
                <label class="form-label" for="direccion">Dirección</label>
                <div class="input-group">
                    <input class="form-control" id="direccion" th:field="*{direccion}" maxlength="255"
                           placeholder="Ej: Av. San Martín 1200, Mendoza" th:disabled="${isDisabled}" />
                    <button class="btn btn-outline-secondary" type="button" id="btnBuscar" th:unless="${isDisabled}">
                        <i class="bi-search"></i> Buscar en el mapa
                    </button>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label" for="latitud">Latitud</label>
                    <input class="form-control" id="latitud" th:field="*{latitud}" readonly th:disabled="${isDisabled}" />
                </div>
                <div class="col">
                    <label class="form-label" for="longitud">Longitud</label>
                    <input class="form-control" id="longitud" th:field="*{longitud}" readonly th:disabled="${isDisabled}" />
                </div>
            </div>
            <div id="mapaProveedor" class="mb-2 border rounded" style="height: 360px;"></div>
            <div class="form-text mb-3" th:unless="${isDisabled}">
                Escribí la dirección y tocá <b>Buscar en el mapa</b>, o hacé clic en el mapa para marcar el punto exacto.
                <a href="#" id="btnQuitar" class="ms-2">Quitar ubicación</a>
            </div>

            <div class="d-flex gap-2">
                <button class="btn btn-dark" type="submit" th:unless="${isDisabled}">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{${basePath} + '/cancelar'}">Volver</a>
            </div>
        </form>
    </div>
</section>

<footer th:replace="~{fragments/footer :: pie-pagina}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout :: leaflet-js}"></th:block>
<script th:inline="javascript">
    (function () {
        const soloLectura = /*[[${isDisabled}]]*/ false;
        const inLat = document.getElementById('latitud');
        const inLng = document.getElementById('longitud');
        const inDir = document.getElementById('direccion');

        const lat0 = parseFloat(inLat.value);
        const lng0 = parseFloat(inLng.value);
        const tieneUbicacion = !isNaN(lat0) && !isNaN(lng0);

        // Si no hay ubicacion cargada, el mapa arranca centrado en Mendoza
        const map = L.map('mapaProveedor').setView(tieneUbicacion ? [lat0, lng0] : [-32.8895, -68.8458], tieneUbicacion ? 16 : 12);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        let marcador = tieneUbicacion ? L.marker([lat0, lng0]).addTo(map) : null;

        function fijarPunto(lat, lng) {
            inLat.value = lat.toFixed(6);
            inLng.value = lng.toFixed(6);
            if (marcador) {
                marcador.setLatLng([lat, lng]);
            } else {
                marcador = L.marker([lat, lng]).addTo(map);
            }
        }

        if (soloLectura) {
            return; // consultar: el mapa solo muestra la ubicacion
        }

        map.on('click', function (e) {
            fijarPunto(e.latlng.lat, e.latlng.lng);
        });

        // Geocodificacion con Nominatim (direccion -> latitud/longitud)
        async function buscarDireccion() {
            const texto = inDir.value.trim();
            if (!texto) {
                alert('Escribí una dirección primero.');
                return;
            }
            try {
                const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&q='
                    + encodeURIComponent(texto);
                const respuesta = await fetch(url);
                const resultados = await respuesta.json();
                if (resultados.length === 0) {
                    alert('No se encontró la dirección. Probá con otra o marcá el punto en el mapa.');
                    return;
                }
                const lat = parseFloat(resultados[0].lat);
                const lng = parseFloat(resultados[0].lon);
                fijarPunto(lat, lng);
                map.setView([lat, lng], 16);
            } catch (err) {
                alert('No se pudo consultar OpenStreetMap. Marcá el punto manualmente en el mapa.');
            }
        }

        document.getElementById('btnBuscar').addEventListener('click', buscarDireccion);
        inDir.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // Enter busca en el mapa en lugar de enviar el formulario
                buscarDireccion();
            }
        });

        document.getElementById('btnQuitar').addEventListener('click', function (e) {
            e.preventDefault();
            inLat.value = '';
            inLng.value = '';
            if (marcador) {
                map.removeLayer(marcador);
                marcador = null;
            }
        });
    })();
</script>
</body>
</html>
