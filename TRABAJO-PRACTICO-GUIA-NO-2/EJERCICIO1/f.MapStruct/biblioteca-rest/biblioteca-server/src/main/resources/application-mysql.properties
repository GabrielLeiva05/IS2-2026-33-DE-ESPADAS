# ============================================================
#  Perfil "mysql":  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#  Ajuste usuario y contraseña a su instalación local de MySQL.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
