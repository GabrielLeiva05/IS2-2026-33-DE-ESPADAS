<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Mis pedidos')}"></head>
<body class="app-sitio">
<div th:replace="~{fragments/iconos :: sprite}"></div>
<th:block th:replace="~{fragments/base :: cabecera}"></th:block>

<main class="sitio-main">
    <div class="contenedor seccion">
        <div class="seccion-titulo">
            <h1 class="mb-0">Mis pedidos</h1>
            <span class="insignia insignia-magenta" th:text="${pedidos.size()} + ' pedidos'">0 pedidos</span>
        </div>

        <p class="texto-secundario" th:if="${pedidos.isEmpty()}">
            Todavía no hay pedidos asociados a tus comercios. Los pedidos los carga el preventista en la visita.
        </p>

        <div class="pila">
            <article class="tarjeta" th:each="p : ${pedidos}">
                <div class="seccion-titulo">
                    <div>
                        <h2 class="mb-0" th:text="${p.nombreComercial}">Comercio</h2>
                        <p class="texto-chico texto-secundario" th:text="${p.fechaReferencia}">fecha</p>
                    </div>
                    <span class="insignia insignia-violeta" th:text="${p.estadoLegible}">Estado</span>
                </div>
                <table class="tabla" th:if="${p.lineas != null and !p.lineas.isEmpty()}">
                    <thead><tr><th>Producto</th><th>Presentaciones</th><th>Subtotal</th></tr></thead>
                    <tbody>
                    <tr th:each="l : ${p.lineas}">
                        <td th:text="${l.nombreProducto}">Producto</td>
                        <td th:text="${l.cantidadPresentaciones}">1</td>
                        <td th:text="'$ ' + ${#numbers.formatDecimal(l.subtotal, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                    </tr>
                    </tbody>
                </table>
                <p th:if="${p.descuento != null and p.descuento.signum() > 0}" class="texto-chico">
                    Descuento <span th:text="${p.promocionCodigo}">PROMO</span>:
                    <span th:text="'− $ ' + ${#numbers.formatDecimal(p.descuento, 1, 'POINT', 2, 'COMMA')}">-$0</span>
                </p>
                <p><strong th:text="'Total: $ ' + ${#numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}">Total</strong></p>
                <a class="btn btn-secundario btn-chico" th:if="${p.conComprobante}"
                   th:href="@{/mis-pedidos/{id}/comprobante(id=${p.id})}">Descargar comprobante</a>
            </article>
        </div>
    </div>
</main>

<div th:replace="~{fragments/base :: pie}"></div>
</body>
</html>
