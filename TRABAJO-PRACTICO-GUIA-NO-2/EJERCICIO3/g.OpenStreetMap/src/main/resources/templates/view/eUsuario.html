<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titleEdit})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/menubody :: menu-principal}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>

<section class="py-5" th:with="esNuevo=${item.id == null or item.id == ''}">
    <div class="container px-4 px-lg-5" style="max-width: 640px;">
        <h2 class="fw-bolder mb-4" th:text="${titleEdit}">Usuario</h2>
        <form th:action="@{${basePath} + '/actualizar'}" th:object="${item}" method="post" class="card card-body p-4">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre de usuario</label>
                <input class="form-control" id="nombre" th:field="*{nombre}" minlength="3" maxlength="50" th:disabled="${isDisabled}" required autofocus />
            </div>
            <div class="mb-3" th:unless="${isDisabled}">
                <label class="form-label" for="clave">Clave</label>
                <!-- No se usa th:field: la clave (hash) nunca se vuelca al HTML -->
                <input class="form-control" id="clave" name="clave" type="password" minlength="6" maxlength="72"
                       th:required="${esNuevo}" autocomplete="new-password" />
                <div class="form-text" th:unless="${esNuevo}">Dejala vacía para conservar la clave actual.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="rol">Rol</label>
                <select class="form-select" id="rol" name="rol" th:disabled="${isDisabled}" required>
                    <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.etiqueta}"
                            th:selected="${item.rol != null and item.rol == r}"></option>
                </select>
                <div class="form-text">El administrador accede a la administración; el cliente solo usa la tienda y su carrito.</div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-dark" type="submit" th:unless="${isDisabled}">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{${basePath} + '/cancelar'}">Volver</a>
            </div>
        </form>
    </div>
</section>

<footer th:replace="~{fragments/footer :: pie-pagina}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
