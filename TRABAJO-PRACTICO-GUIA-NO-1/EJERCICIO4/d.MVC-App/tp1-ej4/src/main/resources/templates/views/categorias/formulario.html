<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/recursos :: recursos}"></th:block>
    <title th:text="${categoria.id == 0} ? 'Agregar Categoria' : 'Editar Categoria'">Agregar Categoria</title>
</head>

<body>

    <nav th:replace="~{components/navbar :: nav_bar(activo='categorias')}"></nav>

    <main class="container py-5 mt-5">

        <h1 class="mb-4" th:text="${categoria.id == 0} ? 'Agregar categoria' : 'Editar categoria'">Agregar categoria</h1>

        <form th:action="@{/formulario/categoria/{id}(id=${categoria.id})}" method="post" th:object="${categoria}">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">
                        Categoria
                    </label>

                    <input type="text"
                           class="form-control"
                           id="nombre"
                           th:field="*{nombre}"
                           placeholder="Ej: Terror">
                    <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

            </div>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i>
                    Guardar
                </button>

            </div>

        </form>

    </main>

    <div th:replace="~{components/footer :: pie}"></div>

    <th:block th:replace="~{components/scripts :: scripts}"></th:block>

</body>
</html>
