# ============================================================
#  SERVIDOR REST - Biblioteca
# ============================================================
spring.application.name=biblioteca-server
server.port=8080

# --- Base de datos por defecto: H2 en memoria (no requiere instalar nada) ---
spring.datasource.url=jdbc:h2:mem:bibliotecadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:bibliotecadb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Se desactiva "open-in-view": toda la información se carga dentro de la capa de servicios (@Transactional)
spring.jpa.open-in-view=false

# --- Logs ---
logging.level.ar.com.biblioteca=INFO

# --- Archivos PDF de los libros ---
# Carpeta del disco del servidor donde se guardan: libro_<titulo>_<id>.pdf
# (en Windows C:/biblioteca == C:\biblioteca; se crea sola si no existe)
biblioteca.storage.pdf-dir=C:/biblioteca
# Tamaño máximo de cada PDF (MB). Debe ser <= spring.servlet.multipart.max-file-size
biblioteca.storage.pdf-max-mb=20
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
