<section id="subcategorias" class="section" th:fragment="abmSubCategoria">
    <div class="header">
        <h1>Subcategorías</h1>
        <p>Gestión y administración de subcategorías por categoría.</p>
    </div>

    <!-- Mensajes de Éxito o Error -->
    <div th:if="${exito != null}" class="alert alert-success" style="padding: 10px; margin-bottom: 15px; background: #d4edda; color: #155724; border-radius: 4px;">
        <p th:text="${exito}" style="margin: 0;"></p>
    </div>

    <div th:if="${error != null}" class="alert alert-danger" style="padding: 10px; margin-bottom: 15px; background: #f8d7da; color: #721c24; border-radius: 4px;">
        <p th:text="${error}" style="margin: 0;"></p>
    </div>

    <!-- Formulario (Alta / Modificación) -->
    <div class="form-container" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 25px;">

        <!-- Modo: Modificar -->
        <form th:if="${subcategoria != null}" th:action="@{/subcategoria/modificar/{id}(id=${subcategoria.id})}" method="POST">
            <h3>Modificar Subcategoría</h3>

            <div style="margin-bottom: 15px;">
                <label>ID:</label>
                <input type="text" th:value="${subcategoria.id}" disabled style="width: 100%; padding: 8px;" />
            </div>

            <div style="margin-bottom: 15px;">
                <label for="subcategoria-nombre-mod">Nombre de la Subcategoría:</label>
                <input type="text" id="subcategoria-nombre-mod" name="nombre" th:value="${subcategoria.nombre}" placeholder="Ej. Remeras manga corta" required style="width: 100%; padding: 8px;" />
            </div>
            <div style="margin-bottom: 15px;">
                <label for="subcategoria-idCategoria-mod">Categoría a la que pertenece:</label>
                <select id="subcategoria-idCategoria-mod" name="idCategoria" required style="width: 100%; padding: 8px;">
                    <option value="" disabled>Seleccione una categoría</option>
                    <option th:each="x : ${categorias}"
                            th:value="${x.id}"
                            th:text="${x.nombre}"
                            th:selected="${subcategoria.categoria != null and subcategoria.categoria.id == x.id}">
                    </option>
                </select>
            </div>

            <div>
                <button type="submit" class="btn-submit" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px;">Actualizar</button>
                <a th:href="@{/admin/dashboard}" style="margin-left: 10px; text-decoration: none; color: #555;">Cancelar</a>
            </div>
        </form>

        <!-- Modo: Registrar -->
        <form th:unless="${subcategoria != null}" th:action="@{/subcategoria/registro}" method="POST">
            <h3>Registrar Nueva Subcategoría</h3>

            <div style="margin-bottom: 15px;">
                <label for="subcategoria-nombre-reg">Nombre de la Subcategoría:</label>
                <input type="text" id="subcategoria-nombre-reg" name="nombre" placeholder="Ej. Remeras manga corta" required style="width: 100%; padding: 8px;" />
            </div>
            <div style="margin-bottom: 15px;">
                <label for="subcategoria-idCategoria-reg">Categoría a la que pertenece:</label>
                <select id="subcategoria-idCategoria-reg" name="idCategoria" required style="width: 100%; padding: 8px;">
                    <option value="" disabled selected>Seleccione una categoría</option>
                    <option th:each="x : ${categorias}" th:if="${x.activo}"
                            th:value="${x.id}"
                            th:text="${x.nombre}">
                    </option>
                </select>
            </div>

            <div>
                <button type="submit" class="btn-submit" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px;">Guardar</button>
            </div>
        </form>

    </div>

    <!-- Listado -->
    <div class="table-container">
        <div class="table-header">
            <h2>Listado de subcategorías</h2>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${subcategorias != null}" th:each="r : ${subcategorias}">
                <td th:text="${r.id}">ID</td>
                <td th:text="${r.nombre}">Nombre</td>
                <td th:text="${r.categoria != null ? r.categoria.nombre : 'Sin categoría'}">Categoría</td>
                <td>
                    <span th:unless="${r.activo}" style="color: red; font-weight: bold;">Inactivo</span>
                    <span th:if="${r.activo}" style="color: green; font-weight: bold;">Activo</span>
                </td>
                <td>
                    <a th:href="@{/subcategoria/modificar/{id}(id=${r.id})}" class="btn-edit" style="text-decoration: none; padding: 5px 10px; background: #ffc107; color: black; border-radius: 3px;">Editar</a>
                    <a th:href="@{/subcategoria/eliminar/{id}(id=${r.id})}" class="btn-delete" th:text="${r.activo ? 'Desactivar' : 'Activar'}" onclick="return confirm('¿Confirmás el cambio de estado de este registro?');" style="text-decoration: none; padding: 5px 10px; background: #dc3545; color: white; border-radius: 3px;">Desactivar</a>
                </td>
            </tr>
            <tr th:if="${subcategorias == null or subcategorias.isEmpty()}">
                <td colspan="5" style="text-align: center;">No hay subcategorías cargados en el sistema.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
