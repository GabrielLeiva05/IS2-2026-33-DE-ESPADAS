<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/headauth :: headauth}"></head>

<body>

<div class="auth-container register">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Registrá un nuevo usuario</p>

    <!-- Mensaje de error -->
    <div data-th-if="${error != null}" class="alert-error">
        <p data-th-text="${error}"></p>
    </div>

    <!-- Mensaje de éxito -->
    <div data-th-if="${exito != null}" class="alert-success">
        <p data-th-text="${exito}"></p>
    </div>

    <form data-th-action="@{/registro}" method="POST" enctype="multipart/form-data" class="auth-form form-grid">

        <!-- ================= DATOS PERSONALES ================= -->

        <!-- Tipo de documento -->
        <div class="form-group">
            <label for="tipoDocumento">Tipo de documento</label>
            <select id="tipoDocumento" name="tipoDocumento" required>
                <option value="" disabled selected>Seleccione un tipo</option>
                <option value="DNI">DNI</option>
                <option value="PASAPORTE">Pasaporte</option>
                <option value="CEDULA">Cédula de Identidad</option>
                <option value="LC">Libreta Cívica</option>
                <option value="LE">Libreta de Enrolamiento</option>
            </select>
        </div>

        <!-- Documento -->
        <div class="form-group">
            <label for="documento">Documento</label>
            <input
                    type="text"
                    id="documento"
                    name="documento"
                    placeholder="Ingrese su número de documento"
                    required
            >
        </div>

        <!-- Fecha de Nacimiento -->
        <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>

        <!-- Nombre -->
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
        </div>

        <!-- Apellido -->
        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required>
        </div>

        <!-- Teléfono -->
        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ingrese su teléfono" required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required>
        </div>

        <!-- Imagen / Foto de perfil -->
        <div class="form-group col-full">
            <label for="imagen">Foto de perfil</label>
            <input type="file" id="imagen" name="archivo" accept="image/*">
        </div>

        <!-- ================= DATOS DE DOMICILIO / UBICACIÓN ================= -->
        <div class="col-full">
            <h3 style="margin-top: 15px; margin-bottom: 5px;">Datos de Domicilio</h3>
        </div>

        <!-- País (Dinámico desde BD) -->
        <div class="form-group">
            <label for="pais">País</label>
            <select id="pais" name="pais" required>
                <option value="" disabled selected>Seleccione un país</option>
                <option th:each="p : ${paises}"
                        th:value="${p.id != null ? p.id : p}"
                        th:text="${p.nombre != null ? p.nombre : p}">
                </option>
            </select>
        </div>

        <!-- Provincia (Dinámico desde BD) -->
        <div class="form-group">
            <label for="provincia">Provincia</label>
            <select id="provincia" name="provincia" required>
                <option value="" disabled selected>Seleccione una provincia</option>
                <option th:each="prov : ${provincias}"
                        th:value="${prov.id != null ? prov.id : prov}"
                        th:text="${prov.nombre != null ? prov.nombre : prov}">
                </option>
            </select>
        </div>

        <!-- Departamento (Dinámico desde BD) -->
        <div class="form-group">
            <label for="departamento">Departamento</label>
            <select id="departamento" name="departamento" required>
                <option value="" disabled selected>Seleccione un departamento</option>
                <option th:each="dep : ${departamentos}"
                        th:value="${dep.id != null ? dep.id : dep}"
                        th:text="${dep.nombre != null ? dep.nombre : dep}">
                </option>
            </select>
        </div>

        <!-- Localidad (Dinámico desde BD) -->
        <div class="form-group">
            <label for="localidad">Localidad</label>
            <select id="localidad" name="localidad" required>
                <option value="" disabled selected>Seleccione una localidad</option>
                <option th:each="loc : ${localidades}"
                        th:value="${loc.id != null ? loc.id : loc}"
                        th:text="${loc.nombre != null ? loc.nombre : loc}">
                </option>
            </select>
        </div>

        <!-- Código Postal -->
        <div class="form-group">
            <label for="codigoPostal">Código postal</label>
            <input type="text" id="codigoPostal" name="codigoPostal" placeholder="Ej: 5500" required>
        </div>

        <!-- Barrio -->
        <div class="form-group">
            <label for="barrio">Barrio</label>
            <input type="text" id="barrio" name="barrio" placeholder="Ingrese el barrio" required>
        </div>

        <!-- Dirección -->
        <div class="form-group">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" placeholder="Calle y número" required>
        </div>

        <!-- Manzana / Piso -->
        <div class="form-group">
            <label for="manzanaPiso">Manzana / Piso</label>
            <input type="text" id="manzanaPiso" name="manzanaPiso" placeholder="Ej: Mza B / Piso 3 Depto A">
        </div>

        <!-- Referencia (Opcional) -->
        <div class="form-group col-full">
            <label for="referencia">Referencia <span style="font-size: 0.85em; color: #777;">(Opcional)</span></label>
            <input type="text" id="referencia" name="referencia" placeholder="Entre calles, color de rejas, portón, etc.">
        </div>

        <!-- ================= SEGURIDAD ================= -->

        <!-- Contraseña -->
        <div class="form-group">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" placeholder="Ingrese su contraseña" required>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="form-group">
            <label for="clave2">Confirmar contraseña</label>
            <input type="password" id="clave2" name="clave2" placeholder="Confirme su contraseña" required>
        </div>

        <!-- Botón de Registro -->
        <div class="col-full">
            <button type="submit" class="btn-submit">
                Registrarse
            </button>
        </div>

    </form>

    <a th:href="@{/login}" class="auth-link">
        ¿Ya tenés una cuenta? Iniciar sesión
    </a>
</div>

</body>
</html>
