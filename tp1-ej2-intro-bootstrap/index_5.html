<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="ruta-de-la-imagen.jpg" class="img-fluid" alt="Descripción de la imagen">
    <img src="imagen.jpg" class="rounded" alt="...">
    <img src="imagen.jpg" class="rounded-circle" alt="...">
    <img src="imagen.jpg" class="img-thumbnail" alt="...">

    <img src="imagen.jpg" class="rounded float-start" alt="...">
    <img src="imagen.jpg" class="rounded float-end" alt="...">
    <img src="imagen.jpg" class="rounded mx-auto d-block" alt="...">

    <!-- La imagen ocupará el 25%, 50% o 75% del ancho disponible -->
    <img src="imagen.jpg" class="img-fluid w-25" alt="...">
    <img src="imagen.jpg" class="img-fluid w-50" alt="...">
    <img src="imagen.jpg" class="img-fluid w-75" alt="...">
    <img src="imagen.jpg" class="img-fluid w-100" alt="...">
</body>
</html>
