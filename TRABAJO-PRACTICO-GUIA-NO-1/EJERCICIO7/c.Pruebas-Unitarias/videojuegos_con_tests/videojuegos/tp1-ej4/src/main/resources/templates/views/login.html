<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/recursos :: recursos}"></th:block>
    <title>Iniciar sesion</title>
</head>
<body>
    <nav th:replace="~{components/navbar :: nav_bar(activo='')}"></nav>
    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5">
                <h2 class="mb-4">Iniciar sesion</h2>

                <div class="alert alert-danger" role="alert" th:if="${error}">
                    <span th:text="${error}"></span>
                </div>
                <div class="alert alert-success" role="alert" th:if="${mensaje}">
                    <span th:text="${mensaje}"></span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contrasena</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{components/footer :: pie}"></div>
    <th:block th:replace="~{components/scripts :: scripts}"></th:block>
</body>
</html>
