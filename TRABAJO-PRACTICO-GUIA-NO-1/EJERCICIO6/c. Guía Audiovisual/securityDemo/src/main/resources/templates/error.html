<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Biblioteca'">Error - Biblioteca</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3f4f6;
            padding: 20px;
        }

        .error-container {
            width: 100%;
            max-width: 460px;
            background-color: #ffffff;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .error-badge {
            display: inline-block;
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #f87171;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        .error-code {
            font-size: 56px;
            font-weight: 800;
            color: #1f2937;
            line-height: 1;
            margin-bottom: 12px;
        }

        .error-title {
            color: #374151;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .error-desc {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .error-detail-box {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 22px;
            font-size: 13px;
            color: #4b5563;
            text-align: left;
            word-break: break-word;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            margin-top: 4px;
            display: inline-block;
        }

        .btn-secondary:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="error-container">
        <!-- Código de estado HTTP -->
        <span class="error-badge" th:text="'Código ' + ${status}">Código 500</span>
        <div class="error-code" th:text="${status}">500</div>

        <!-- Título y descripción provistos por el controlador -->
        <h1 class="error-title" th:text="${titulo}">Error</h1>
        <p class="error-desc" th:text="${descripcion}">Ha ocurrido un inconveniente.</p>

        <!-- Detalle técnico opcional (solo se muestra si existe) -->
        <div class="error-detail-box" th:if="${detalle != null}">
            <strong>Detalle:</strong> <span th:text="${detalle}"></span>
        </div>

        <!-- Botones de redirección -->
        <div class="actions">
            <a th:href="@{/inicio}" class="btn-primary">Volver al inicio</a>
            <a th:href="@{/login}" class="btn-secondary">Ir a Iniciar Sesión</a>
        </div>
    </div>

</body>
</html>
