spring.application.name=carrito-compras
server.port=8080

# ---------- Base de datos MySQL ----------
# Se pueden sobreescribir con variables de entorno: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tienda_carrito}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: crea/actualiza las tablas a partir de las entidades (ideal para desarrollo y la cursada)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# OSIV activo: permite que la vista (Thymeleaf) lea relaciones LAZY. Ver README (aspectos importantes).
spring.jpa.open-in-view=true

# ---------- Vista ----------
spring.thymeleaf.cache=false
spring.mvc.ignore-default-model-on-redirect=true

# ---------- Subida de imagenes ----------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Datos de ejemplo ----------
# true: si la BD esta vacia carga proveedores, articulos (con imagen) y un usuario admin/admin123
app.seed.enabled=true
