<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Pedidos')}"></head>
<body class="app-admin">
<div th:replace="~{fragments/iconos :: sprite}"></div>
<div class="velo" data-velo></div>
<div class="shell">
    <aside th:replace="~{fragments/base :: sidebar}"></aside>
    <div class="shell-main">
        <header th:replace="~{fragments/base :: topbar('Pedidos')}"></header>
        <main class="contenido">
            <div class="encabezado-pagina mt-4">
                <div>
                    <h1>Pedidos</h1>
                    <p>Bandeja de pedidos presenciales, estado del pago y conciliación de transferencias.</p>
                </div>
                <span class="insignia insignia-violeta" th:text="${pedidos.size()} + ' pedidos'">0 pedidos</span>
            </div>

            <div th:replace="~{fragments/base :: alertas}"></div>

            <form class="mt-4" method="get" th:action="@{/pedidos}" role="search">
                <label class="oculto-visual" for="busqueda">Buscar por comercio</label>
                <input id="busqueda" name="busqueda" type="search" placeholder="Buscar por comercio"
                       th:value="${busqueda}">
                <input type="hidden" name="estado" th:value="${estadoSeleccionado}">
                <button type="submit" class="btn btn-secundario btn-chico">Buscar</button>
            </form>

            <nav class="pestanias mt-4" aria-label="Filtrar por estado">
                <a th:href="@{/pedidos}" th:classappend="${estadoSeleccionado == null or estadoSeleccionado == ''} ? 'activo'">Todos</a>
                <a th:each="e : ${estados}" th:href="@{/pedidos(estado=${e})}"
                   th:classappend="${estadoSeleccionado == e} ? 'activo'" th:text="${e}">Estado</a>
            </nav>

            <section class="tarjeta tarjeta-tabla">
                <div class="vacio" th:if="${pedidos.isEmpty()}">
                    <svg class="icono"><use href="#i-pedido"/></svg>
                    <p class="mb-0">Todavía no hay pedidos con ese criterio.</p>
                </div>
                <table class="tabla tabla-apilable" th:unless="${pedidos.isEmpty()}">
                    <thead><tr><th>Comercio</th><th>Fecha</th><th>Estado</th><th class="alinear-derecha">Total</th><th><span class="oculto-visual">Acciones</span></th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td class="celda-principal">
                            <strong th:text="${p.nombreComercial}">Comercio</strong>
                        </td>
                        <td data-label="Fecha" th:text="${p.fechaReferencia}">01/01/2026 10:00</td>
                        <td data-label="Estado"><span class="insignia" th:classappend="${p.claseEstado}" th:text="${p.estadoLegible}">Estado</span></td>
                        <td data-label="Total" class="alinear-derecha"
                            th:text="'$ ' + ${#numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}">$ 0,00</td>
                        <td class="celda-acciones">
                            <div class="acciones">
                                <a class="btn btn-secundario btn-chico" th:href="@{/pedidos/{id}(id=${p.id})}">
                                    <svg class="icono icono-sm"><use href="#i-ok"/></svg>Ver detalle</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/base :: navInferior}"></nav>
</body>
</html>
