<!DOCTYPE html>
<!--
  Equivalente a HistoriaPacientePage.jsx + FotoPacienteCard + DetalleForm + FiltroDetalles + DetallesLista.
  Datos que manda HistoriaVistaController: paciente, medicos, historia, detalles, form,
  filtroCriterio, filtroValor, version, error, exito.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historia clínica')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/layout :: topnav}"></nav>
<div id="layoutSidenav">
    <div th:replace="~{fragments/layout :: sidenav}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4 py-4">

                <div class="d-flex align-items-center justify-content-between mt-2 mb-4">
                    <h1 class="mb-0">Historia clínica</h1>
                    <a th:href="@{/pacientes}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                </div>

                <div th:replace="~{fragments/layout :: mensajes}"></div>

                <!-- Solo si el paciente existe (si no, queda el error + "Volver") -->
                <div class="row" th:if="${paciente}">

                    <!-- ===== Columna izquierda: datos y foto ===== -->
                    <div class="col-lg-3">
                        <div class="card mb-4">
                            <div class="card-header"><i class="bi bi-person me-2"></i>Paciente</div>
                            <div class="card-body">
                                <h5 class="mb-1" th:text="${paciente.apellido} + ', ' + ${paciente.nombre}">Gómez, Ana</h5>
                                <div class="text-muted" th:text="'Documento: ' + ${paciente.documento}">Documento: 40111222</div>
                            </div>
                        </div>

                        <!-- FotoPacienteCard -->
                        <div class="card mb-4">
                            <div class="card-header"><i class="bi bi-camera me-2"></i>Foto</div>
                            <div class="card-body text-center">
                                <!-- La imagen la sirve FotoVistaController (GET /pacientes/{id}/foto). ?v= evita la caché. -->
                                <img th:if="${paciente.tieneFoto}"
                                     th:src="@{/pacientes/{id}/foto(id=${paciente.id}, v=${version})}"
                                     alt="Foto del paciente" class="img-fluid rounded" style="max-height: 220px">
                                <i th:unless="${paciente.tieneFoto}" class="bi bi-person-bounding-box text-secondary"
                                   style="font-size: 6rem"></i>

                                <!-- multipart/form-data: el formato para mandar archivos. Se envía solo al elegir el archivo. -->
                                <form th:action="@{/pacientes/{id}/foto(id=${paciente.id})}" method="post"
                                      enctype="multipart/form-data">
                                    <label class="btn btn-outline-primary btn-sm w-100 mt-3">
                                        <span th:text="${paciente.tieneFoto} ? 'Cambiar foto' : 'Subir foto'">Subir foto</span>
                                        <input type="file" name="archivo" accept="image/*" hidden
                                               onchange="this.form.submit()">
                                    </label>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- ===== Columna derecha: historia ===== -->
                    <div class="col-lg-9">

                        <!-- Sin historia: botón para crearla -->
                        <div class="card" th:if="${historia == null}">
                            <div class="card-body text-center py-5">
                                <i class="bi bi-journal-plus text-secondary" style="font-size: 3rem"></i>
                                <p class="mt-3">Este paciente todavía no tiene historia clínica.</p>
                                <form th:action="@{/pacientes/{id}/historia/crear(id=${paciente.id})}" method="post">
                                    <button class="btn btn-primary" type="submit">Crear historia clínica</button>
                                </form>
                            </div>
                        </div>

                        <!-- th:block no genera ninguna etiqueta: solo agrupa (como el <></> de React) -->
                        <th:block th:if="${historia != null}">

                            <!-- DetalleForm: alta o modificación (según form.editando) -->
                            <form th:action="@{/pacientes/{id}/historia/detalles/guardar(id=${paciente.id})}"
                                  method="post" class="card mb-4">
                                <div class="card-header">
                                    <i class="bi bi-plus-circle me-2"></i>
                                    <span th:text="${form.editando} ? 'Modificar atención' : 'Nueva atención'">Nueva atención</span>
                                </div>
                                <div class="card-body">
                                    <input type="hidden" name="id" th:value="${form.id}">
                                    <!-- El filtro activo viaja oculto para volver a la lista filtrada después de guardar -->
                                    <input type="hidden" name="criterio" th:value="${filtroCriterio}">
                                    <input type="hidden" name="valor" th:value="${filtroValor}">
                                    <div class="row g-2 mb-2">
                                        <div class="col-md-4">
                                            <label class="form-label small" for="fecha">Fecha</label>
                                            <input type="date" class="form-control" id="fecha" name="fechaHistoria"
                                                   th:value="${form.fechaHistoria}">
                                        </div>
                                        <div class="col-md-8">
                                            <label class="form-label small" for="medico">Médico</label>
                                            <select class="form-select" id="medico" name="medicoId">
                                                <option value="">Seleccionar médico...</option>
                                                <option th:each="m : ${medicos}" th:value="${m.id}"
                                                        th:text="${m.apellido} + ', ' + ${m.nombre}"
                                                        th:selected="${m.id == form.medicoId}">Pérez, Juan</option>
                                            </select>
                                        </div>
                                    </div>
                                    <label class="form-label small" for="texto">Detalle de la atención</label>
                                    <textarea class="form-control mb-3" id="texto" name="detalleHistoria" rows="3"
                                              placeholder="Motivo de consulta, diagnóstico, indicaciones..."
                                              th:text="${form.detalleHistoria}"></textarea>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-primary" type="submit"
                                                th:text="${form.editando} ? 'Guardar cambios' : 'Agregar atención'">Agregar atención</button>
                                        <a th:if="${form.editando}" class="btn btn-secondary"
                                           th:href="@{/pacientes/{id}/historia(id=${paciente.id}, criterio=${filtroCriterio}, valor=${filtroValor})}">Cancelar</a>
                                    </div>
                                </div>
                            </form>

                            <h5 class="mb-3">
                                <span th:text="'Atenciones (' + ${#lists.size(detalles)} + ')'">Atenciones (0)</span>
                                <span th:if="${filtroCriterio}" class="badge text-bg-info ms-2 fw-normal"
                                      th:text="|Filtro: ${filtroCriterio} = ${filtroValor}|">Filtro</span>
                            </h5>

                            <!-- FiltroDetalles: un GET a la misma página con ?criterio=...&valor=...
                                 Cada opción es una ESTRATEGIA del backend (@Component("medico"), ("texto"), ("desde")). -->
                            <form th:action="@{/pacientes/{id}/historia(id=${paciente.id})}" method="get" class="card mb-3">
                                <div class="card-body py-2">
                                    <div class="row g-2 align-items-center">
                                        <div class="col-auto"><i class="bi bi-funnel text-secondary"></i></div>
                                        <div class="col-md-3">
                                            <select class="form-select form-select-sm" id="criterio" name="criterio">
                                                <option value="medico" th:selected="${filtroCriterio == 'medico'}">Médico</option>
                                                <option value="texto" th:selected="${filtroCriterio == 'texto'}">Texto de la atención</option>
                                                <option value="desde" th:selected="${filtroCriterio == 'desde'}">Desde la fecha</option>
                                            </select>
                                        </div>
                                        <div class="col">
                                            <input class="form-control form-control-sm" id="valor" name="valor"
                                                   th:type="${filtroCriterio == 'desde'} ? 'date' : 'text'"
                                                   th:value="${filtroValor}" placeholder="Nombre o apellido del médico">
                                        </div>
                                        <div class="col-auto d-flex gap-1">
                                            <button class="btn btn-sm btn-outline-primary" type="submit">Buscar</button>
                                            <a th:if="${filtroCriterio}" class="btn btn-sm btn-outline-secondary"
                                               th:href="@{/pacientes/{id}/historia(id=${paciente.id})}">Quitar filtro</a>
                                        </div>
                                    </div>
                                </div>
                            </form>

                            <!-- DetallesLista -->
                            <div th:if="${#lists.isEmpty(detalles)}" class="alert alert-light border">
                                Todavía no hay atenciones registradas.
                            </div>
                            <div class="list-group" th:unless="${#lists.isEmpty(detalles)}">
                                <div th:each="d : ${detalles}" class="list-group-item"
                                     th:classappend="${d.id == form.id} ? 'list-group-item-warning'">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <div class="fw-semibold">
                                                <i class="bi bi-calendar-event me-2"></i>
                                                <!-- #temporals: formatea LocalDate → "17/10/2026" -->
                                                <span th:text="${#temporals.format(d.fechaHistoria, 'dd/MM/yyyy')}">17/10/2026</span>
                                                <span class="text-muted fw-normal ms-3">
                                                    <i class="bi bi-person-badge me-1"></i>
                                                    <span th:text="${d.medico != null} ? |${d.medico.apellido}, ${d.medico.nombre}| : 'Sin médico'">Pérez, Juan</span>
                                                </span>
                                            </div>
                                            <!-- pre-wrap respeta los saltos de línea que escribió el médico -->
                                            <div class="mt-2" style="white-space: pre-wrap" th:text="${d.detalleHistoria}">Detalle</div>
                                        </div>
                                        <div class="d-flex gap-1 ms-3">
                                            <a class="btn btn-sm btn-outline-primary" title="Editar"
                                               th:href="@{/pacientes/{id}/historia(id=${paciente.id}, editar=${d.id}, criterio=${filtroCriterio}, valor=${filtroValor})}">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/pacientes/{id}/historia/detalles/eliminar(id=${paciente.id})}"
                                                  method="post" onsubmit="return confirm('¿Eliminar esta atención?');">
                                                <input type="hidden" name="detalleId" th:value="${d.id}">
                                                <input type="hidden" name="criterio" th:value="${filtroCriterio}">
                                                <input type="hidden" name="valor" th:value="${filtroValor}">
                                                <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<script th:replace="~{fragments/layout :: scripts}"></script>
<script>
    // Lo único "dinámico" que queda en el navegador: con "Desde la fecha" el campo pasa a ser un calendario.
    // (En React esto lo hacía el estado de FiltroDetalles.)
    const criterio = document.getElementById("criterio");
    const valor = document.getElementById("valor");
    const AYUDAS = { medico: "Nombre o apellido del médico", texto: "Ej: presión, control...", desde: "" };
    function ajustarCampo(limpiar) {
        if (!criterio) return;
        valor.type = criterio.value === "desde" ? "date" : "text";
        valor.placeholder = AYUDAS[criterio.value];
        if (limpiar) valor.value = ""; // un texto no sirve como fecha (y al revés)
    }
    if (criterio) {
        criterio.addEventListener("change", function () { ajustarCampo(true); });
        ajustarCampo(false);
    }
</script>
</body>
</html>
