<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head(${formulario.nuevo} ? 'Nuevo proveedor' : 'Editar proveedor')}"></head>
<body class="app-admin">
<div th:replace="~{fragments/iconos :: sprite}"></div>
<div class="velo" data-velo></div>
<div class="shell">
    <aside th:replace="~{fragments/base :: sidebar}"></aside>
    <div class="shell-main">
        <header th:replace="~{fragments/base :: topbar(${formulario.nuevo} ? 'Nuevo proveedor' : 'Editar proveedor')}"></header>
        <main class="contenido">
            <div class="encabezado-pagina mt-4">
                <div>
                    <p class="migas"><a th:href="@{/proveedores}"><svg class="icono icono-sm"><use href="#i-volver"/></svg>Proveedores</a></p>
                    <h1 th:text="${formulario.nuevo} ? 'Nuevo proveedor' : ${formulario.razonSocial}">Proveedor</h1>
                </div>
            </div>
            <div class="alerta alerta-error mb-4" role="alert" th:if="${error != null}">
                <svg class="icono"><use href="#i-error"/></svg><span th:text="${error}">Error</span></div>
            <form class="form-pagina" th:action="${formulario.nuevo} ? @{/proveedores} : @{/proveedores/{id}(id=${formulario.id})}"
                  th:object="${formulario}" method="post" data-envio-unico>
                <section class="tarjeta">
                    <fieldset class="seccion-form">
                        <legend><svg class="icono"><use href="#i-documento"/></svg>Datos fiscales</legend>
                        <div class="fila-campos dos">
                            <div class="campo"><label class="requerido" for="razonSocial">Razón social</label>
                                <input class="control" id="razonSocial" th:field="*{razonSocial}" maxlength="150" required></div>
                            <div class="campo"><label class="requerido" for="cuit">CUIT</label>
                                <input class="control" id="cuit" th:field="*{cuit}" inputmode="numeric" maxlength="13" required placeholder="30712345671">
                                <span class="ayuda">11 dígitos; se verifica el dígito verificador.</span></div>
                        </div>
                    </fieldset>
                    <fieldset class="seccion-form">
                        <legend><svg class="icono"><use href="#i-ubicacion"/></svg>Dirección</legend>
                        <div class="fila-campos dos">
                            <div class="campo"><label class="requerido" for="idPais">País</label>
                                <select class="control" id="idPais" th:field="*{idPais}" required data-hijo="idProvincia"
                                        th:data-cascada="@{/ubicacion/provincias/} + '{id}'">
                                    <option value="">Seleccioná una opción</option>
                                    <option th:each="o : ${opciones.paises}" th:value="${o.id}" th:text="${o.nombre}">País</option>
                                </select></div>
                            <div class="campo"><label class="requerido" for="idProvincia">Provincia</label>
                                <select class="control" id="idProvincia" th:field="*{idProvincia}" required data-hijo="idDepartamento"
                                        th:data-cascada="@{/ubicacion/departamentos/} + '{id}'" data-vacio="Elegí primero el país"
                                        th:disabled="${opciones.provincias.isEmpty()}">
                                    <option value="">Seleccioná una opción</option>
                                    <option th:each="o : ${opciones.provincias}" th:value="${o.id}" th:text="${o.nombre}">Provincia</option>
                                </select></div>
                        </div>
                        <div class="fila-campos dos">
                            <div class="campo"><label class="requerido" for="idDepartamento">Departamento</label>
                                <select class="control" id="idDepartamento" th:field="*{idDepartamento}" required data-hijo="idLocalidad"
                                        th:data-cascada="@{/ubicacion/localidades/} + '{id}'" data-vacio="Elegí primero la provincia"
                                        th:disabled="${opciones.departamentos.isEmpty()}">
                                    <option value="">Seleccioná una opción</option>
                                    <option th:each="o : ${opciones.departamentos}" th:value="${o.id}" th:text="${o.nombre}">Departamento</option>
                                </select></div>
                            <div class="campo"><label class="requerido" for="idLocalidad">Localidad</label>
                                <select class="control" id="idLocalidad" th:field="*{idLocalidad}" required data-vacio="Elegí primero el departamento"
                                        th:disabled="${opciones.localidades.isEmpty()}">
                                    <option value="">Seleccioná una opción</option>
                                    <option th:each="o : ${opciones.localidades}" th:value="${o.id}"
                                            th:text="${o.codigoPostal != null} ? ${o.nombre} + ' (CP ' + ${o.codigoPostal} + ')' : ${o.nombre}">Localidad</option>
                                </select></div>
                        </div>
                        <div class="fila-campos tres">
                            <div class="campo ocupa-2"><label class="requerido" for="calle">Calle</label>
                                <input class="control" id="calle" th:field="*{calle}" autocomplete="address-line1" maxlength="120" required></div>
                            <div class="campo"><label class="requerido" for="numeracion">Número</label>
                                <input class="control" id="numeracion" th:field="*{numeracion}" maxlength="10" required placeholder="742 o S/N"></div>
                        </div>
                        <div class="fila-campos tres">
                            <div class="campo"><label for="barrio">Barrio</label>
                                <input class="control" id="barrio" th:field="*{barrio}" maxlength="80"></div>
                        </div>
                    </fieldset>
                </section>
                <div class="barra-acciones">
                    <a class="btn btn-fantasma" th:href="@{/proveedores}">Cancelar</a>
                    <button type="submit" class="btn btn-primario" th:text="${formulario.nuevo} ? 'Dar de alta' : 'Guardar cambios'">Guardar</button>
                </div>
            </form>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/base :: navInferior}"></nav>
</body>
</html>
