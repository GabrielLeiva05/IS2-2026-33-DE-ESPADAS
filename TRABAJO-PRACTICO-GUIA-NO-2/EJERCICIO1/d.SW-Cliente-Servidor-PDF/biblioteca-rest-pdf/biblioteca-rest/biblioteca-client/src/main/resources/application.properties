# ============================================================
#  CLIENTE WEB - Biblioteca
# ============================================================
spring.application.name=biblioteca-client
server.port=8081

# URL base de la API REST del servidor (aplicación biblioteca-server)
biblioteca.api.base-url=http://localhost:8080/api/v1

# Plantillas Thymeleaf: sin caché para ver los cambios al instante durante el desarrollo
spring.thymeleaf.cache=false

# Subida de PDF desde el formulario de libros (el cliente los reenvía al servidor).
# Mantener estos límites alineados con los del servidor.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
