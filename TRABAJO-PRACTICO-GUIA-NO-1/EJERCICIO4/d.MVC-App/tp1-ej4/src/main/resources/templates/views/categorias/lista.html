<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{components/recursos :: recursos}"></th:block>
    <title>Categorias</title>
</head>

<body>

    <nav th:replace="~{components/navbar :: nav_bar(activo='categorias')}"></nav>

    <main class="container py-5 mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>Categorias</h1>

            <!-- Nueva categoria -->
            <a th:href="@{/formulario/categoria/0}"
               class="btn btn-success"
               title="Nueva categoria">
                <i class="bi bi-plus-lg"></i>
            </a>

        </div>

        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-primary">
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col" class="text-center">Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="categoria : ${categorias}"
                        th:classappend="${categoria.activo} ? '' : 'table-danger'">
                        <td th:text="${categoria.nombre}"></td>

                        <td class="text-center">

                            <a th:href="@{/formulario/categoria/{id}(id=${categoria.id})}"
                               class="btn btn-warning btn-sm me-1"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <a th:href="@{/eliminar/categoria/{id}(id=${categoria.id})}"
                               th:if="${categoria.activo}"
                               class="btn btn-danger btn-sm"
                               title="Borrar">
                                <i class="bi bi-trash"></i>
                            </a>

                            <a th:href="@{/eliminar/categoria/{id}(id=${categoria.id})}"
                               th:unless="${categoria.activo}"
                               class="btn btn-secondary btn-sm"
                               title="Reactivar">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </a>

                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <div th:replace="~{components/footer :: pie}"></div>

    <th:block th:replace="~{components/scripts :: scripts}"></th:block>

</body>
</html>
