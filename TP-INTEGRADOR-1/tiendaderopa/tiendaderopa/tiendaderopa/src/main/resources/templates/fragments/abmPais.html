<section id="paises" class="section" th:fragment = "abmPais">
    <div class="header">
        <h1>Países</h1>
        <p>Gestión y administración de países.</p>
    </div>

    <p class="notice success" th:if="${exito != null}" th:text="${exito}"></p>
    <p class="notice error" th:if="${error != null}" th:text="${error}"></p>

    <!-- Formulario (Alta / Modificación) -->
    <section class="form-container">

        <!-- Modo: Modificar País -->
        <form th:if="${pais != null}" th:action="@{/pais/modificar/{id}(id=${pais.id})}" method="POST">
            <h3>Modificar país</h3>

            <div class="form-group">
                <label for="id-pais-mod">ID</label>
                <input type="text" id="id-pais-mod" th:value="${pais.id}" disabled />
            </div>

            <div class="form-group">
                <label for="nombre-mod">Nombre del país</label>
                <input type="text" id="nombre-mod" name="nombre" th:value="${pais.nombre}" placeholder="Ej. Argentina" required />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Actualizar</button>
                <a class="btn-cancel" th:href="@{/admin/dashboard}">Cancelar</a>
            </div>
        </form>

        <!-- Modo: Registrar Nuevo País -->
        <form th:unless="${pais != null}" th:action="@{/pais/registro}" method="POST">
            <h3>Registrar nuevo país</h3>

            <div class="form-group">
                <label for="nombre-reg">Nombre del país</label>
                <input type="text" id="nombre-reg" name="nombre" placeholder="Ej. Argentina" required />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Guardar</button>
            </div>
        </form>

    </section>

    <!-- Listado de Países -->
    <section class="table-container">
        <div class="table-header">
            <h2>Listado de países</h2>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${paises != null}" th:each="p : ${paises}">
                    <td th:text="${p.id}">ID</td>
                    <td th:text="${p.nombre}">Nombre</td>
                    <td>
                        <span th:if="${p.eliminado}" class="estado estado-eliminado">Eliminado</span>
                        <span th:unless="${p.eliminado}" class="estado estado-activo">Activo</span>
                    </td>
                    <td class="row-actions">
                        <a th:href="@{/pais/modificar/{id}(id=${p.id})}" class="btn-edit">Editar</a>
                        <a th:href="@{/pais/eliminar/{id}(id=${p.id})}" class="btn-delete" onclick="return confirm('¿Estás seguro de eliminar este país?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${paises == null or #lists.isEmpty(paises)}">
                    <td colspan="4">No hay países cargados en el sistema.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</section>
