<div xmlns:th="http://www.thymeleaf.org" th:fragment="shell">
    <div id="cart-backdrop" class="cart-backdrop" hidden></div>
    <aside id="cart-drawer" class="cart-drawer" aria-hidden="true" inert>
        <header class="drawer-heading">
            <div>
                <p class="eyebrow">TU COMPRA</p>
                <h2>Carrito</h2>
            </div>
            <button type="button" class="drawer-close" aria-label="Cerrar carrito" data-cart-close>×</button>
        </header>
        <div id="cart-drawer-content" class="cart-drawer-content"></div>
    </aside>
</div>
