<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estado del pago | Zero</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/store.css}">
</head>
<body class="storefront">
<header class="store-header">
    <a class="brand" th:href="@{/}">ZERO<span>.</span></a>
    <nav aria-label="Navegación principal">
        <a th:href="@{/carrito}">Mi carrito</a>
        <a th:href="@{/}">Catálogo</a>
    </nav>
</header>

<main class="payment-result">
    <p class="eyebrow">MERCADO PAGO</p>
    <h1>Estado de tu pago</h1>
    <p class="result-message" th:text="${mensaje}"></p>
    <dl th:if="${orden != null}" class="result-details">
        <div><dt>Orden</dt><dd th:text="${orden.identificadorCompra}"></dd></div>
        <div><dt>Estado</dt><dd th:text="${orden.estadoOrdenCompra}"></dd></div>
        <div th:if="${orden.mercadoPagoStatus != null}">
            <dt>Mercado Pago</dt><dd th:text="${orden.mercadoPagoStatus}"></dd>
        </div>
    </dl>
    <div class="result-actions">
        <a class="pay-button pay-link" th:href="@{/carrito}">Volver al carrito</a>
        <a class="catalog-link" th:href="@{/}">Ir al catálogo</a>
    </div>
</main>

<footer class="store-footer"><span>ZERO</span><span>Ropa deportiva unisex</span></footer>
</body>
</html>
