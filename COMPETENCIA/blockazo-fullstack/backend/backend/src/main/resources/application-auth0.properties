# ===================== OAuth2 - Auth0 =====================
# Se activa con el perfil "auth0" (SPRING_PROFILES_ACTIVE=auth0).
#
# En el dashboard de Auth0 (Applications > tu aplicacion > Settings):
#   - Application Type: "Regular Web Application"  (NO "Single Page Application": esa no tiene client secret)
#   - Allowed Callback URLs:
#         http://localhost:8080/login/oauth2/code/auth0
#         http://localhost:5173/login/oauth2/code/auth0   (si se usa el proxy de Vite)
#   - Token Endpoint Authentication Method: "Post" (es el valor por defecto de Auth0)
#         -> debe coincidir con client-authentication-method de abajo. Si en Auth0 se cambio a "Basic",
#            usar client_secret_basic aca (o borrar la linea).
#
# Si el login falla con "invalid_client", el motivo real queda en el log del backend
# ("Login OAuth2 fallido: ...").
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.auth0.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.auth0.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email

# AUTH0_DOMAIN va SIN "https://" y SIN "/" al final. Ej: mi-tenant.us.auth0.com
# (la barra final de la URL es obligatoria: Auth0 la incluye en el "issuer" de sus tokens)
spring.security.oauth2.client.provider.auth0.issuer-uri=https://${AUTH0_DOMAIN}/
