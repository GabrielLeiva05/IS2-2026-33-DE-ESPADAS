<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Catálogo y stock')}"></head>
<body class="app-admin">
<div th:replace="~{fragments/iconos :: sprite}"></div>
<div class="velo" data-velo></div>
<div class="shell">
    <aside th:replace="~{fragments/base :: sidebar}"></aside>
    <div class="shell-main">
        <header th:replace="~{fragments/base :: topbar('Catálogo y stock')}"></header>
        <main class="contenido">
            <div class="encabezado-pagina mt-4">
                <div>
                    <h1>Catálogo publicado</h1>
                    <p>Productos con precio vigente y su stock disponible.</p>
                </div>
            </div>

            <form class="tarjeta filtros" th:action="@{/catalogo}" method="get" role="search">
                <div class="campo">
                    <label for="texto">Buscar</label>
                    <div class="control-con-icono">
                        <svg class="icono"><use href="#i-buscar"/></svg>
                        <input class="control" id="texto" name="texto" type="search" th:value="${texto}"
                               placeholder="Nombre, código o descripción" enterkeyhint="search">
                    </div>
                </div>
                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <select class="control" id="categoria" name="categoria" data-auto-envio>
                        <option value="">Todas</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                                th:selected="${c.id == categoria}">Categoría</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="ofertas">Ofertas</label>
                    <select class="control" id="ofertas" name="ofertas" data-auto-envio>
                        <option value="false" th:selected="${!ofertas}">Todos los productos</option>
                        <option value="true" th:selected="${ofertas}">Solo ofertas</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-azul"><svg class="icono icono-sm"><use href="#i-buscar"/></svg>Filtrar</button>
            </form>

            <section class="tarjeta tarjeta-tabla mt-4">
                <div class="vacio" th:if="${productos.isEmpty()}">
                    <svg class="icono"><use href="#i-catalogo"/></svg>
                    <p class="mb-0">No hay productos publicados que coincidan con la búsqueda.</p>
                </div>
                <table class="tabla tabla-apilable" th:unless="${productos.isEmpty()}">
                    <thead>
                    <tr><th>Producto</th><th>Categoría</th><th>Presentación</th><th>Precio</th><th>Stock</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${productos}">
                        <td class="celda-principal">
                            <div class="persona">
                                <img th:if="${p.primeraImagen != null}" class="avatar" style="object-fit:cover;background:var(--dm-superficie-2)"
                                     th:src="${apiPublica} + '/api/imagenes/' + ${p.primeraImagen} + '/contenido'" alt="" loading="lazy">
                                <span th:unless="${p.primeraImagen != null}" class="avatar"><svg class="icono icono-sm"><use href="#i-catalogo"/></svg></span>
                                <div><strong th:text="${p.nombre}">Producto</strong>
                                    <small th:text="${p.codigo}">código</small>
                                    <span class="insignia insignia-oferta" th:if="${p.enOferta}">OFERTA</span></div>
                            </div>
                        </td>
                        <td data-label="Categoría" th:text="${p.categoria} + ' › ' + ${p.subCategoria}">Categoría</td>
                        <td data-label="Presentación" th:text="${p.presentacionLegible}">Caja x 24</td>
                        <td data-label="Precio"><strong th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}">$ 0,00</strong></td>
                        <td data-label="Stock">
                            <span class="insignia" th:classappend="${p.stockDisponible > 0} ? 'insignia-verde' : 'insignia-roja'"
                                  th:text="${p.stockDisponible > 0} ? ${p.stockDisponible} + ' disponibles' : 'Sin stock'">stock</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
<nav th:replace="~{fragments/base :: navInferior}"></nav>
</body>
</html>
