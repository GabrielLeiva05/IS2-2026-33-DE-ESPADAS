<section id="newsletter" class="section" th:fragment="newsletter">
    <div class="header">
        <h1>Newsletter</h1>
        <p>Correo con los productos en oferta. Se envía automáticamente cada 10 días a los clientes.</p>
    </div>

    <div th:if="${exitoNewsletter != null}" style="padding:10px;margin-bottom:15px;background:#d4edda;color:#155724;border-radius:4px;">
        <p th:text="${exitoNewsletter}" style="margin:0;"></p>
    </div>
    <div th:if="${errorNewsletter != null}" style="padding:10px;margin-bottom:15px;background:#f8d7da;color:#721c24;border-radius:4px;">
        <p th:text="${errorNewsletter}" style="margin:0;"></p>
    </div>

    <div style="background:#f9f9f9;padding:20px;border-radius:8px;margin-bottom:25px;">
        <form th:action="@{/admin/newsletter/enviar}" method="POST"
              onsubmit="return confirm('¿Enviar el newsletter ahora a todos los clientes?');">
            <button type="submit" style="padding:8px 15px;background:#007bff;color:white;border:none;border-radius:4px;">Enviar ahora</button>
            <a th:href="@{/admin/newsletter/vista-previa}" target="_blank" style="margin-left:10px;text-decoration:none;color:#555;">Ver vista previa</a>
        </form>
    </div>

    <div class="table-container">
        <div class="table-header"><h2>Historial de envíos</h2></div>
        <table>
            <thead>
            <tr><th>Fecha</th><th>Productos</th><th>Enviados</th><th>Fallidos</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${envios}">
                <td th:text="${#temporals.format(e.fechaEnvio,'dd/MM/yyyy HH:mm')}">Fecha</td>
                <td th:text="${e.cantidadProductos}">0</td>
                <td th:text="${e.destinatariosEnviados}">0</td>
                <td th:text="${e.destinatariosFallidos}">0</td>
            </tr>
            <tr th:if="${envios == null or #lists.isEmpty(envios)}">
                <td colspan="4" style="text-align:center;">Todavía no se envió ningún newsletter.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
